<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets">
<title>#{fbresource['Freshers_Buddy']}</title>
<center>
	<div id="overlay"></div>
	<div id="LoaderX" class="LX">
		<div style="color: green; font-size: 25px; margin-left: 50px;"
			id="LoaderContainer">
			<img src='/exam/css/loading.gif' />
		</div>
	</div>
</center>
<h:head>
	<meta http-equiv="Content-Type"
		content="text/html; charset=UTF-8; charset=windows-1252" />
	<link rel="ICON" href="/exam/template/favicon.ico" />
	<link rel="icon" type="image/png"
		href="http://localhost:8080/exam/template/favicon.ico" />
	<!-- Style -->
	<link href="/exam/css/StyleSheet.css" rel="stylesheet"
		type="text/css" />
	<link rel="stylesheet" href="/exam/css/menu.css" type="text/css" />
	<link href="/exam/css/CCP.css" rel="stylesheet" type="text/css" />
	<link rel="stylesheet"
		href="/exam/css/start/jquery-ui-1.10.3.custom.css" />
	<!-- Scripts -->
	<script type="text/javascript" src="/exam/js/jquery-1.9.1.js"></script>
	<script type="text/javascript"
		src="/exam/js/jquery.carouFredSel-6.1.0-packed.js"></script>

	<script type="text/javascript"
		src="/exam/js/jquery-ui-1.10.3.custom.js"></script>
	<script type="text/javascript" src="/exam/js/jquery.slides.min.js"></script>
	<script src="/exam/js/login.js"></script>
	<script type="text/javascript" src="/exam/js/CCP.js"></script>
	<script src="/exam/ckeditor/ckeditor.js"></script>
	<script src="/exam/js/jquery.easing.1.3.js" type="text/javascript"></script>
	<script src="/exam/js/jquery.kwicks-1.5.1.pack.js"
		type="text/javascript"></script>
	<script type="text/javascript" src="/exam/js/jquery.cookie.js"></script>

	<!-- Chat start -->
	<link rel="shortcut icon" type="image/ico"
		href="/exam/chat/css/images/favicon.ico" />
	<link type="text/css" rel="stylesheet" media="screen"
		href="/exam/chat/components/bootstrap/dist/css/bootstrap.min.css" />
	<link type="text/css" rel="stylesheet" media="screen"
		href="/exam/chat/components/fontawesome/css/font-awesome.min.css" />
	<link type="text/css" rel="stylesheet" media="screen"
		href="/exam/chat/css/converse.css" />
	<script src="/exam/chat/dist/converse.js"></script>
	<!-- Chat end -->
	<style rel="stylesheet" type="text/css">
#wrapper_error {
	width: 500px;
	padding: 0px;
	margin: auto;
	position: relative;
	top: 70px;
}

#login_header_error {
	width: 100%;
	padding: 0px;
	float: left;
	margin: 0px 0px 3px 0px;
	height: 40px;
}

#content {
	float: left;
	width: 484px;
	_width: 470px;
}

#login_box {
	float: left:      width:    484px;
	border: 2px solid green;
	background-color: #CCFFFF;
	height: 255px;
	_height: 250px; *
	height: 250px;
}

#body_input_error {
	background-color: #CCFFFF;
	border-bottom: 1px solid #c4c4c4;
	padding: 15px 10px 8px 20px;
	_padding: 15px 0px 8px 20px;
}

#error_box {
	width: 100%;
}

.fail_text {
	color: red;
	font-size: 20px;
}

.pass_text {
	color: green;
	font-size: 20px;
}

#error_message {
	float: left;
	margin-left: 18px;
	width: 100%;
	color: white;
	margin-bottom: 70px;
	_margin-left: 9px;
}

.err_msg {
	margin: 11px 5px 0px 0px;
	font-weight: bold;
	font-size: 11px;
	color: teal;
	font-family: Arial, Helvetica, sans-serif;
}
</style>
</h:head>
<h:body onload="hidePleaseWait();">
	<f:view locale="#{LanguageLocaleBean.locale}">
		<f:loadBundle var="fbresource" basename="com.exam.fbresource" />
		<div id="top_bg"></div>
		<div id="Wrap">
			<div id="Top">
				<h:form id="login">
					<table styleClass="margin_left_14" halign="center" width="99%">
						<tr>
							<td>
								<center>
									<div align="center" id="wrapper_error">
										<div id="content">
											<div id="login_box">
												<div id="body_input_error">
													<h:panelGroup
														rendered="#{ResultBean.error eq null || ResultBean.error eq ''}">
														<div id="error_box">
															<h:panelGroup
																rendered="#{ResultBean.exam.showResult and ResultBean.result eq 'Disqualified'}">
																<div class="fail_text">
																	#{fbresource['BEST_LUCK_NEXT_TIME']} <br />
																	<h:outputLabel value="#{ResultBean.name}"
																		escape="false" />
																	<br />#{ResultBean.criteria}
																</div>
															</h:panelGroup>
															<h:panelGroup
																rendered="#{ResultBean.exam.showResult and ResultBean.result ne 'Disqualified'}">
																<div class="pass_text">
																	#{fbresource['CONGRATULATIONS']} <br />
																	<h:outputLabel value="#{ResultBean.name}"
																		escape="false" />
																	<br />#{ResultBean.criteria} <br />#{ResultBean.result}
																</div>
															</h:panelGroup>
															<h:commandLink style="color:blue;font-size:20px;"
																value="#{fbresource['download_Certificate']}"
																rendered="#{ResultBean.certificate ne null}"
																action="#{ResultBean.dowanloadCertificate}" />
															<f:verbatim
																rendered="#{ResultBean.exam.showResult eq 'false'}">
																<center>
																	<font color="blue" size="4">#{fbresource['Please_contact_admin_for_result']}</font>
																</center>
															</f:verbatim>
														</div>
													</h:panelGroup>
													<h:panelGroup rendered="#{ResultBean.error ne null}">
														<div id="error_box">
															<div class="fail_text">
																<h:outputLabel value="#{ResultBean.error}"
																	escape="false" />
															</div>
														</div>
													</h:panelGroup>
													<br />
													<br />
													<center>
														<font color="green" size="5">#{fbresource['Thank_you_for_giving_the_test']}</font>
													</center>
												</div>
											</div>
										</div>
									</div>
								</center>
							</td>
						</tr>
					</table>
				</h:form>
			</div>
		</div>
	</f:view>
</h:body>
</html>
