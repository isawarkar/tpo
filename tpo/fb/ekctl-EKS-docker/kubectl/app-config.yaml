---
apiVersion: v1
kind: Service
metadata:
  name: service-fresher-buddy
  namespace: fresher-buddy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fresher-buddy
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-fresher-buddy
  namespace: fresher-buddy
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: "/FB/actuator/health"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:542115677157:certificate/3957e9dd-3f2a-48db-bc82-7084df0cd32f
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: alb
  rules:
    - host: www.fresherbuddy.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-fresher-buddy
                port:
                  number: 80

