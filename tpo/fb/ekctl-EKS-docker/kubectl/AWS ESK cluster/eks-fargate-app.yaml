apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-fresher-buddy
  namespace: fresher-buddy
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: "/FB/actuator/health"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:542115677157:certificate/b07794cc-9659-41e9-8721-05a2a03d6437
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: alb
  rules:
    - host: www.fresherbuddy.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-fresher-buddy
                port:
                  number: 80
  tls:
    - hosts:
        - www.fresherbuddy.in
      secretName: dummy-secret  # Placeholder only; ACM certificate is used by ALB