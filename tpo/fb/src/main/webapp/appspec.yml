version: 0.0
os: linux
files:
  - source: .
    destination: /opt/tomcat/apache-tomcat-9.0.54/webapps/FB/
hooks:
  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/change_permissions.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
  ApplicationStop:
    - location: scripts/stop_server1.sh
      timeout: 300
      runas: root
