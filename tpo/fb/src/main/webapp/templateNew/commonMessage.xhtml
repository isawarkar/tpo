<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition>
<h:panelGroup id="errorPanel" style="margin-left: 130px;">
	<f:verbatim rendered="#{UIBackingBean.successMessageBool || UIBackingBean.infoMessageBool || UIBackingBean.errorMessageBool}">
	<br/>
	</f:verbatim>
	<h:outputText  style="margin-left: 130px;" title="#{fbresource['Success_Message']}"
		rendered="#{UIBackingBean.successMessageBool}"
		styleClass="successMessage" value="#{UIBackingBean.successMessage}" />
	<h:outputText   style="margin-left: 130px;" title="#{fbresource['Info_Message']}"
		rendered="#{UIBackingBean.infoMessageBool}" styleClass="infoMessage"
		value="#{UIBackingBean.infoMessage}" />
	<h:outputText  style="margin-left: 130px;"  title="#{fbresource['Error_Message']}"
		rendered="#{UIBackingBean.errorMessageBool}" styleClass="errorMessage"
		value="#{UIBackingBean.errorMessage}" />
	<f:verbatim rendered="#{UIBackingBean.successMessageBool || UIBackingBean.infoMessageBool || UIBackingBean.errorMessageBool}">
	<br /><br/>
	</f:verbatim>
</h:panelGroup>
</ui:composition>
</html>
