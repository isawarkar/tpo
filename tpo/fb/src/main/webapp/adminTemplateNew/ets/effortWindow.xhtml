<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<h:form id="effortWindowForm">
	<o:window rendered="#{AddEffort.employeeEffort ne null}" id="effort"
		resizable="true" width="1050px" height="400px"
		caption="#{fbresource['Add_Update']}"
		captionStyle="background: #bbbbbb;
                            border-bottom: #e9e9e9 solid 1px;
                            position: relative;
                            padding: 0 0 0 6px;
                            color: white;"
		modal="true" modalLayerClass="modalLayer">

		<o:captionArea>
			<o:minimizeWindowButton minimizeImageUrl="/images/win_minimize.png"
				restoreImageUrl="./images/win_restore.jpg" styleClass="customButton"
				rolloverClass="buttonRollover" />
			<o:maximizeWindowButton maximizeImageUrl="/images/win_maximize.png"
				restoreImageUrl="images/win_restore.jpg" styleClass="customButton"
				rolloverClass="buttonRollover" />
			<o:closeWindowButton imageUrl="/images/win_close.png"
				styleClass="customButton" rolloverClass="buttonRollover" />
		</o:captionArea>
		<ui:include src="/xhtml/errorPanel.xhtml" />

		<fieldset>
			<legend>#{fbresource['effort']}
				#{fbresource['ADD_OR_UPDATE']}</legend>
			<table styleClass="effort_table" halign="center">
				<tr>
					<td><h:outputText id="leave" value="#{fbresource.Leave}" /></td>
					<td><h:selectBooleanCheckbox id="leaveCheckbox"
							value="#{AddEffort.employeeEffort.leavestatus}">
							<o:ajax event="change" execute="leaveCheckbox"
								render="dayParent dayParent1 Project Module Hours" />
						</h:selectBooleanCheckbox></td>
				</tr>
				<tr>
					<td><h:panelGroup id="dayParent">
							<h:outputText
								rendered="#{param['effortWindowForm:leaveCheckbox'] eq 'on'}"
								id="DayLabel" value="#{fbresource.Day}" />
						</h:panelGroup></td>
					<td><h:panelGroup id="dayParent1">
							<h:selectOneRadio id="FullDayLabel1"
								required="true"
								rendered="#{param['effortWindowForm:leaveCheckbox'] eq 'on'}"
								value="#{AddEffort.employeeEffort.leaveday}">
								<f:selectItem itemValue="F" itemLabel="#{fbresource['FullDay']}" />
								<f:selectItem itemValue="H" itemLabel="#{fbresource['HalfDay']}" />
							</h:selectOneRadio>
						</h:panelGroup></td>
				</tr>
				<tr>
					<td><h:outputText id="ProjectLabel"
							value="#{fbresource.project_name}" /></td>
					<td><h:selectOneMenu
							value="#{AddEffort.employeeEffort.project}"
							disabled="#{param['effortWindowForm:leaveCheckbox'] eq 'on'}"
							binding="#{AddEffort.projectsListSelectOne}" id="Project"
							valueChangeListener="#{AddEffort.renderModule}"
							required="#{param['effortWindowForm:leaveCheckbox'] eq 'off'}"
							onchange="submit();" immediate="true">
						</h:selectOneMenu></td>
				</tr>
				<tr>
					<td><h:outputText id="ModuleLabel"
							value="#{fbresource.Module_Name}" /></td>
					<td><h:selectOneMenu value="#{AddEffort.employeeEffort.module}"
							disabled="#{param['effortWindowForm:leaveCheckbox'] eq 'on'}"
							id="Module" binding="#{AddEffort.module}" /></td>
				</tr>
				<tr>
					<td><h:outputText id="DescriptionLabel"
							value="#{fbresource.Description}" /></td>
					<td><h:inputTextarea
							rows="5"
							cols="35" id="Description"
							value="#{AddEffort.employeeEffort.description}" /></td>
				</tr>
				<tr>
					<td><h:outputText id="DateLabel" value="#{fbresource.Date}"></h:outputText>
					</td>
					<td><o:dateChooser pattern="dd/MM/yyyy"
							buttonImageUrl="/images/calendar.gif" immediate="true"
							title="#{common['Please_enter_date_in_dd_mm_yyyy_format']}"
							value="#{AddEffort.employeeEffort.sdate}" id="dob" required="true">
							<f:convertDateTime locale="in" pattern="dd/MM/yyyy" />
						</o:dateChooser> <o:floatingIconMessage style="border-color: red;" for="dob"
							showDetail="true" showSummary="false" /></td>
				</tr>
				<tr>
					<td><h:outputText id="HoursLabel" value="#{fbresource.Hours}" /></td>
					<td><h:inputText
							disabled="#{param['effortWindowForm:leaveCheckbox'] eq 'on'}" id="Hours"
							maxlength="2" size="2" value="#{AddEffort.employeeEffort.time}">
							<f:convertNumber />
							<f:validateLongRange minimum="4" maximum="20" />
						</h:inputText></td>
				</tr>
				<tr>
					<td><h:outputText id="RemarksReasonLabel"
							value="#{fbresource.Remarks_Reason}" /></td>
					<td><h:inputTextarea id="RemarksReason" rows="5" cols="35"
							value="#{AddEffort.employeeEffort.remarks}" /></td>
				</tr>
			</table>

			<table halign="left">
				<tr>
					<td><h:commandButton class="btn btn-primary glow"  id="addButton" value="#{fbresource.add}"
							action="#{AddEffort.save}" /></td>
					<td><h:commandButton class="btn btn-primary glow"  value="#{fbresource['Reset']}"
							type="reset" rendered="#{AddEffort.currentDocMode ne 'Update'}"
							title="#{fbresource['Please_click_here_to_reset_form_values']}" /></td>
					<td><h:commandButton class="btn btn-primary glow"  value="#{fbresource['Close']}"
							type="button" onclick="O$('effortWindowForm:effort').hide();"
							title="#{fbresource['Please_click_here_to_close']}" /></td>
				</tr>
			</table>
		</fieldset>
	</o:window>
	<script>
		CKEDITOR.replace('effortWindowForm:Description');
		CKEDITOR.replace('effortWindowForm:RemarksReason');
	</script>
</h:form>
</html>
