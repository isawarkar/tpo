<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<h:form id="projectWindowForm">
	<o:window rendered="#{ProjectBean.project ne null}" id="project"
		resizable="true" width="1050px" height="200px"
		caption="#{fbresource['Add_Update']}"
		captionStyle="background: #bbbbbb;
                            border-bottom: #e9e9e9 solid 1px;
                            position: relative;
                            padding: 0 0 0 6px;
                            color: white;"
		modal="true" modalLayerClass="modalLayer">

		<o:captionArea>
			<o:minimizeWindowButton minimizeImageUrl="/images/win_minimize.png"
				restoreImageUrl="./images/win_restore.jpg" styleClass="customButton"
				rolloverClass="buttonRollover" />
			<o:maximizeWindowButton maximizeImageUrl="/images/win_maximize.png"
				restoreImageUrl="images/win_restore.jpg" styleClass="customButton"
				rolloverClass="buttonRollover" />
			<o:closeWindowButton imageUrl="/images/win_close.png"
				styleClass="customButton" rolloverClass="buttonRollover" />
		</o:captionArea>
		<ui:include src="/xhtml/errorPanel.xhtml" />

		<fieldset>
			<legend>#{fbresource['project']}
				#{fbresource['ADD_OR_UPDATE']}</legend>
			<table styleClass="project_table" halign="center">
				<tr>
					<td><h:outputText
							value="#{fbresource.project_name}" /><font color="red">*</font></td>
					<td><h:inputText id="projectName" size="20"
							 maxlength="100" required="true"
							requiredMessage="Value is required"
							value="#{ProjectBean.project.projectname}" /></td>
				</tr>
				<tr>
					<td><h:outputText
							value="#{fbresource.Project_ID}" /><font color="red">*</font></td>
					<td><h:inputText id="projectId" size="5"
							 maxlength="10" required="true"
							requiredMessage="Value is required"
							value="#{ProjectBean.project.projectid}" /></td>
				</tr>
			</table>

			<table halign="left">
				<tr>
					<td><h:commandButton class="btn btn-primary glow"  id="addButton" value="#{fbresource.add}"
							action="#{ProjectBean.save}" /></td>
					<td><h:commandButton class="btn btn-primary glow"  value="#{fbresource['Reset']}"
							type="reset" rendered="#{ProjectBean.currentDocMode ne 'Update'}"
							title="#{fbresource['Please_click_here_to_reset_form_values']}" /></td>
					<td><h:commandButton class="btn btn-primary glow"  value="#{fbresource['Close']}"
							type="button" onclick="O$('projectWindowForm:project').hide();"
							title="#{fbresource['Please_click_here_to_close']}" /></td>
				</tr>
			</table>
		</fieldset>
	</o:window>
</h:form>
</html>
