<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<h:form  id="rejectWindowForm">
	<o:window rendered="#{EffortTableBean.selectedEffortsList.size() > 0}" id="reason" resizable="true" width="1050px" height="450px"
		caption="#{fbresource['Remarks_Reason']}"
		captionStyle="background: #bbbbbb;
                            border-bottom: #e9e9e9 solid 1px;
                            position: relative;
                            padding: 0 0 0 6px;
                            color: white;"
		modal="true" modalLayerClass="modalLayer">

		<o:captionArea>
			<o:minimizeWindowButton minimizeImageUrl="/images/win_minimize.png"
				restoreImageUrl="./images/win_restore.jpg" styleClass="customButton"
				rolloverClass="buttonRollover" />
			<o:maximizeWindowButton maximizeImageUrl="/images/win_maximize.png"
				restoreImageUrl="images/win_restore.jpg" styleClass="customButton"
				rolloverClass="buttonRollover" />
			<o:closeWindowButton imageUrl="/images/win_close.png"
				styleClass="customButton" rolloverClass="buttonRollover" />
		</o:captionArea>
		<ui:include src="/xhtml/errorPanel.xhtml" />

		<fieldset>
			<legend>#{fbresource['effort']}
				#{fbresource['Remarks_Reason']}</legend>
			<table styleClass="effort_table" halign="center">
				<tr>
					<td><h:outputText id="RemarksReasonLabel"
							value="#{fbresource['Remarks_Reason']}" /><font color="red">*</font></td>
				</tr>
				<tr>
					<td><h:inputTextarea required="true" id="RemarksReason"
							rows="5" cols="35" value="#{EffortTableBean.rejectReason}" /></td>
				</tr>
				<tr>
					<td><h:commandButton class="btn btn-primary glow"  value="#{fbresource['Reject']}"
							id="rejectButtonAction"
							title="#{fbresource['Click_here_to']} #{fbresource['Reject']}"
							action="#{EffortTableBean.rejectSeletedRecord}">
						</h:commandButton>
						<h:commandButton class="btn btn-primary glow"  style="margin-left:5px;"
							value="#{fbresource['Close']}" type="button"
							onclick="O$('rejectWindowForm:reason').hide();"
							title="#{fbresource['Please_click_here_to_close']}" /></td>
				</tr>
			</table>

		</fieldset>
	</o:window>
	<script>
		CKEDITOR.replace('rejectWindowForm:RemarksReason');
	</script>
</h:form>
</html>
