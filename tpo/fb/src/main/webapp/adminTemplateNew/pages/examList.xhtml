<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="adminLayoutNew.xhtml">
	<ui:define name="content">
		<ui:include src="/xhtml/allPopUps.xhtml" />
		<ui:include src="examWindow.xhtml" />
		<ui:include src="chartWindow.xhtml" />
			<section id="card-actions">
			<!-- Info table about action starts -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">#{fbresource['Exam_List']}</h4>
							<a class="heading-elements-toggle"> <i
								class='bx bx-dots-vertical font-medium-3' /></a>
							<div class="heading-elements">
								<ul class="list-inline mb-0">
									<li><h:form>
											<h:panelGroup id="bookmarkButtonPanel">
												<o:commandLink id="bookmarkButton" execute="bookmarkButton"
													render="bookmarkButtonPanel bookmarkList errorPanel"
													actionListener="#{BookmarkBean.setBookmark}">
													<f:param name="bookmarkName" value="examList" />
													
													<i title="#{fbresource['bookmarkToolTip']}"
														class="ficon bx #{BookmarkBean.getIcon('examList')} warning" />
												</o:commandLink>
											</h:panelGroup>
										</h:form></li>
									<li><a data-action="collapse"> <i
											class="bx bx-chevron-down" /></a></li>
									<li><a data-action="expand"> <i
											class="bx bx-fullscreen" /></a></li>
									<li><a data-action="reload"> <i class="bx bx-revision" /></a></li>
									<li><a data-action="close"> <i class="bx bx-x" /></a></li>
								</ul>
							</div>
						</div>
						<div class="card-content collapse show">
							<div class="card-body">
								<div class="row">
									<div class="col-sm-12">
										<div class="table-responsive">
											<h:form id="ExamForm">
												<table cellSpacing="5">
													<tr>
														<td><h:outputText value="#{fbresource['Exam_Name']}" /></td>
														<td><o:dropDownField id="examName" maxlength="50"
																immediate="true" style="width: 200px;"
																listItemStyle="white-space: nowrap;"
																suggestionMode="stringStart" var="testName"
																value="#{ExamTableBean.examName}" suggestionMinChars="1">
																<o:dropDownItems value="#{ExamTableBean.testList}" />
																<o:column>
																	<h:outputText value="#{testName}"
																		styleClass="dropDownValuesClass" />
																</o:column>
															</o:dropDownField> <o:floatingIconMessage style="border-color: red;"
																for="examName" showDetail="true" showSummary="false" /></td>

														<td><h:commandButton class="btn btn-primary glow"
																value="#{fbresource['search']}"
																title="#{fbresource['Click_here_to']} #{fbresource['Search_Record']}"
																action="#{ExamTableBean.searchRecord}" /></td>
														<td><o:commandButton
																styleClass="btn btn-primary glow"
																value="#{fbresource['add']}" id="addExam"
																title="#{fbresource['Please_click_here_to_Add_new_Exam']}"
																onajaxend="if(O$('ExamWindowForm:Exam') != null){O$('ExamWindowForm:Exam').show();}"
																render="ExamWindowForm"
																actionListener="#{ExamTableBean.setExamToAdd}" /></td>
														<td><o:commandButton
																styleClass="btn btn-primary glow"
																value="#{fbresource['update']}" id="update"
																title="#{fbresource['Click_here_to']} #{fbresource['update']}"
																onajaxend="if(O$('ExamWindowForm:Exam') != null){O$('ExamWindowForm:Exam').show();}"
																execute="ExamForm" render="ExamWindowForm errorPanel"
																actionListener="#{ExamTableBean.setExam}" /></td>
														<td><h:commandButton class="btn btn-primary glow"
																value="#{fbresource['delete']}" id="deleteButtonAction"
																title="#{fbresource['Click_here_to']} #{fbresource['delete']}"
																action="#{ExamTableBean.deleteSelectedExam}">
																<o:confirmation id="buttonConfirmation"
																	message="#{fbresource['Are_you__sure_you_want_to_delete']}"
																	draggable="true" />
															</h:commandButton></td>
														<td><h:commandButton class="btn btn-primary glow"
																value="#{fbresource['Delete_with_all_the_Questions']}"
																id="deleteWithQuestion"
																title="#{fbresource['Please_click_here_to_delete_with_all_the_Questions']}"
																action="#{ExamTableBean.deleteWithQuestions}">
																<o:confirmation
																	id="deleteWithQuestionbuttonConfirmation"
																	message="#{fbresource['Are_you__sure_you_want_to_delete_with_all_the_Questions']}"
																	draggable="true" />
															</h:commandButton></td>
														<td><h:commandButton class="btn btn-primary glow"
																value="#{fbresource['Start_Test']}"
																title="#{fbresource['Start_Online_Test']}"
																action="#{ExamTableBean.testStart}" /></td>
														<td><button
																title="#{fbresource['Please_click_here_to_open_Import_Export_Exam_Window']}"
																class="btn btn-primary glow" id="importExam"
																type="button" data-toggle="modal"
																data-target="#importExam">
																#{fbresource['Import_Export_Exam']}</button></td>
														<td><input type="button"
															value="#{fbresource['Print']}"
															class="btn btn-primary glow"
															title="#{fbresource['Click_here_to']} #{fbresource['Print']}"
															onClick="window.print()" /></td>
													</tr>
												</table>
												<h:panelGroup id="paginationTableContainner">
													<o:dataTable id="examListTable" var="exam"
														value="#{ExamTableBean.examList}" sortAscending="true"
														sortableHeaderRolloverStyle="background: #d4d4d4"
														style="width: 100%; line-height: 17px;"
														styleClass="datatable"
														rolloverRowStyle="background: #f1f1f1;">
														<o:multipleRowSelection
															rowDatas="#{ExamTableBean.selectedExamList}"
															style="background: #a4aec5; color: white;" />
														<o:columnReordering />
														<f:facet name="columnMenu">
															<o:columnMenu />
														</f:facet>
														<o:column style="width: 3%;text-align: center;">
															<h:graphicImage styleClass="blinking"
																title="#{fbresource['Number_of_Questions_Error']}"
																rendered="#{(exam.endrange-exam.startrange) > exam.numberOfQuestions}"
																url="/images/red_blank.png" />
															<h:graphicImage styleClass="blinking"
																title="#{fbresource['Expired']}"
																rendered="#{exam.className ne ''}"
																url="/images/red_expired.png" />
														</o:column>
														<o:selectionColumn style="width: 6%;" sortable="true"
															header="#{fbresource['Selection']}">
															<f:facet name="header">
																<o:selectAllCheckbox />
															</f:facet>
														</o:selectionColumn>
														<o:column header="#{fbresource['Exam_Name']}"
															sortingExpression="#{exam.testname}"
															style="text-align: center;;color:blue;">
															<h:commandLink style="cursor:hand;color:blue;"
																action="#{ExamTableBean.showInfo}"
																value="#{exam.testname}"
																title="#{fbresource['Please_click_here_to_see_Question_List']}" />
														</o:column>
														<o:column header="#{fbresource['Result_Type']}"
															sortingExpression="#{exam.minute}"
															style="text-align: center;color:red;">
															<h:outputText value="#{exam.resultType}" />
														</o:column>
														<o:column header="#{fbresource['Negative_Marks']}"
															sortingExpression="#{exam.negativeMark}"
															style="text-align: center;;color:navyblue;">
															<h:outputText value="#{exam.negativeMark}" />
														</o:column>
														<o:column header="#{fbresource['Passing_Criteria']}"
															sortingExpression="#{exam.passingcriteria}"
															style="text-align: center;;color:yellow;">
															<h:outputText value="#{exam.passingcriteria}" />
															<f:verbatim rendered="#{exam.resultType eq 'Percent'}">
																<h:outputText value="%" />
															</f:verbatim>
														</o:column>
														<o:column header="#{fbresource['Start_Range']}"
															sortingExpression="#{exam.startrange}"
															style="text-align: center;;color:cyan;">
															<h:outputText value="#{exam.startrange}" />
														</o:column>
														<o:column header="#{fbresource['End_Range']}"
															sortingExpression="#{exam.endrange}"
															style="text-align: center;;color:orange;">
															<h:outputText value="#{exam.endrange}" />
														</o:column>
														<o:column header="#{fbresource['No_Of_Questions']}"
															sortingExpression="#{exam.noOfQuestions}"
															style="text-align: center;;color:brown;">
															<h:outputText value="#{exam.noOfQuestions}" />
														</o:column>
														<o:column header="#{fbresource['Valid_From']}"
															sortingExpression="#{exam.validFrom}"
															style="text-align: center;color:green;">
															<h:outputText value="#{exam.validFrom}">
																<f:convertDateTime pattern="dd/MM/yyyy HH:mm a" />
															</h:outputText>
														</o:column>
														<o:column header="#{fbresource['Valid_To']}"
															sortingExpression="#{exam.validTo}"
															style="text-align: center;color:red">
															<h:outputText value="#{exam.validTo}"
																styleClass="#{exam.className}">
																<f:convertDateTime pattern="dd/MM/yyyy HH:mm a" />
															</h:outputText>
														</o:column>
														<o:column header="#{fbresource['Time_MM']}"
															sortingExpression="#{exam.minute}"
															style="text-align: center;color:purple;">
															<h:outputText value="#{exam.minute}" />
														</o:column>
														<o:column header="#{fbresource['CDA']}"
															sortingExpression="#{exam.allowCertDownload}"
															style="text-align: center;color:grey ;">
															<h:outputText value="#{fbresource['NO']}" title="#{fbresource['Certificate_Download_Allowed']}"
																rendered="#{exam.allowCertDownload eq false}" />
															<h:outputText value="#{fbresource['YES']}" title="#{fbresource['Certificate_Download_Allowed']}"
																rendered="#{exam.allowCertDownload eq true}" />
															
														</o:column>
														<o:column header="#{fbresource['NOQ']}"
															sortingExpression="#{exam.numberOfQuestions}"
															style="text-align: center;">
															<h:outputText style="color:green;"
																rendered="#{exam.numberOfQuestions >= (exam.endrange-exam.startrange)}"
																title="#{fbresource['Number_of_Questions_db']}"
																value="#{exam.numberOfQuestions}" />
															<h:outputText style="color:red;font-size:30px;"
																styleClass="blinking"
																rendered="#{(exam.endrange-exam.startrange) > exam.numberOfQuestions}"
																title="#{fbresource['Number_of_Questions_Error']}"
																value="#{exam.numberOfQuestions}" />

														</o:column>
														<o:column style="width: 3%;text-align: center;">
															<o:commandLink style="color:blue;" id="resultAnalysis"
																title="#{fbresource['Click_here_to_see_the_Exam_Analysis']}"
																actionListener="#{ExamTableBean.setExamResult}"
																onajaxend="if(O$('ChartWindowForm:Chart') != null){O$('ChartWindowForm:Chart').show();}"
																render="ChartWindowForm errorPanel">
																<h:graphicImage
																	title="#{fbresource['Click_here_to_see_the_Exam_Analysis']}"
																	url="/images/chart.jpg" />
																<h:inputHidden value="#{exam.testname}" />
															</o:commandLink>
														</o:column>
														<f:event listener="#{ExamTableBean.inIt}"
															type="preRenderView"></f:event>
													</o:dataTable>
													<table align="right">
														<tr>
															<td><ui:include src="/xhtml/pagination.xhtml" /></td>
														</tr>
													</table>
												</h:panelGroup>
												<font style="margin-left: 20px;" color="red">*#{fbresource['CDA']} = #{fbresource['Certificate_Download_Allowed']}</font>
												<br/>
												<font style="margin-left: 20px;" color="red">*#{fbresource['NOQ']} = #{fbresource['Number_of_Questions_db']}</font>
											</h:form>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</ui:define>
</ui:composition>
</html>
