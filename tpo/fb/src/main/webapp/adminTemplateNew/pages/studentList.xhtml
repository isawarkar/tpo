<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="adminLayoutNew.xhtml">
	<ui:define name="content">
		<ui:include src="/xhtml/collegeLookUp.xhtml" />
		<ui:include src="StudentChartWindow.xhtml" />
		<section id="card-actions">
			<!-- Info table about action starts -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">#{fbresource['Student_List']}</h4>
							<a class="heading-elements-toggle"> <i
								class='bx bx-dots-vertical font-medium-3'></i>
							</a>
							<div class="heading-elements">
								<ul class="list-inline mb-0">
										<li><h:form>
										<h:panelGroup id="bookmarkButtonPanel">
											<o:commandLink id="bookmarkButton" execute="bookmarkButton"
												render="bookmarkButtonPanel bookmarkList errorPanel"
												actionListener="#{BookmarkBean.setBookmark}">
												<f:param name="bookmarkName" value="studentList" />
												<i title="#{fbresource['bookmarkToolTip']}" class="ficon bx #{BookmarkBean.getIcon('studentList')} warning" />
											</o:commandLink>
										</h:panelGroup>
									</h:form></li>
									
									<li><a data-action="collapse"> <i
											class="bx bx-chevron-down"></i>
									</a></li>
									<li><a data-action="expand"> <i
											class="bx bx-fullscreen"></i>
									</a></li>
									<li><a data-action="reload"> <i class="bx bx-revision"></i>
									</a></li>
									<li><a data-action="close"> <i class="bx bx-x"></i>
									</a></li>
								</ul>
							</div>
						</div>
						<div class="card-content collapse show">
							<div class="card-body">
								<div class="row">
									<div class="col-sm-12">
										<div class="table-responsive">
											<h:form id="StudentForm">
												<button style="display: none" id="addToCompanyButton"
													type="button" data-toggle="modal"
													data-target="#addToCompany" />
												<!--Notice Message start -->
												<div class="modal fade text-left" id="addToCompany"
													tabindex="-1" role="dialog"
													aria-labelledby="myModalLabel160" aria-hidden="true">
													<div
														class="modal-dialog modal-dialog-centered modal-dialog-scrollable"
														role="document">
														<div class="modal-content">
															<div class="modal-header bg-primary">
																<h5 class="modal-title white" id="myModalLabel160">#{fbresource['Add_Delete_to_Company']}</h5>
																<button type="button" class="close" data-dismiss="modal"
																	aria-label="Close">
																	<i class="bx bx-x"></i>
																</button>
															</div>
															<div class="modal-body">
																<h:panelGroup id="addToCompanyPanel">
																	<ui:include src="/xhtml/errorPanel.xhtml" />
																	<center>
																		<TABLE>
																			<tr>
																				<td>#{fbresource['Company_Name']} <font
																					color="red">*</font>
																				</td>
																				<td><h:selectOneMenu id="addTocompanyName"
																						value="#{RegistrationTableBean.companyName}">
																						<f:selectItem itemLabel="" itemValue="" />
																						<f:selectItem
																							rendered="#{!RegistrationTableBean.addStudentFlag}"
																							itemLabel="#{fbresource['All']}" itemValue="All" />
																						<f:selectItems
																							value="#{RegistrationTableBean.companyList}" />
																					</h:selectOneMenu></td>
																			</tr>
																			<tr>
																				<td align="center" colspan="2"><o:commandButton styleClass="btn btn-primary glow" 
																						rendered="#{RegistrationTableBean.addStudentFlag}"
																						execute="addTocompanyName studentListTable"
																						render="addToCompanyPanel studentListTable errorPanel"
																						action="#{RegistrationTableBean.addToCompany}"
																						value="#{fbresource['Add_To_Company']}" /> <o:commandButton styleClass="btn btn-primary glow" 
																						rendered="#{!RegistrationTableBean.addStudentFlag}"
																						execute="addTocompanyName studentListTable"
																						render="addToCompanyPanel studentListTable errorPanel"
																						action="#{RegistrationTableBean.deleteForCompany}"
																						value="#{fbresource['Delete_from_Company']}" /></td>
																			</tr>
																		</TABLE>
																	</center>
																</h:panelGroup>
															</div>
															<div class="modal-footer">
																<button type="button" class="btn btn-light-secondary"
																	data-dismiss="modal">
																	<i class="bx bx-x d-block d-sm-none"></i> <span
																		class="d-none d-sm-block">#{fbresource['Close']}</span>
																</button>
															</div>
														</div>
													</div>
												</div>
												<!--Notice Message start -->
												<table width="100%">
													<tr>
														<td>
															<table inlineStyle="color:green;" halign="left"
																cellSpacing="5">
																<tr>
																	<td><h:outputText
																			value="#{fbresource['Enrollment_No']}" /></td>
																	<td><h:inputText
																			value="#{RegistrationTableBean.rollNumber}"
																			id="rollNumber" size="14" maxlength="14">
																		</h:inputText></td>
																	<td><h:outputText
																			value="#{fbresource['Advanced_search']}" /></td>
																	<td><h:selectBooleanCheckbox id="addvance"
																			title="#{fbresource['Please_check_to_show_Advance_Search_fields']}">
																			<o:ajax
																				listener="#{RegistrationTableBean.setAdvSearch}"
																				event="change" execute="addvance" render="advParent" />
																		</h:selectBooleanCheckbox></td>
																	<td><h:commandButton class="btn btn-primary glow" 
																			value="#{fbresource['search']}"
																			title="#{fbresource['Click_here_to']} #{fbresource['Search_Record']}"
																			action="#{RegistrationTableBean.searchRecord}" /></td>
																	<td><h:commandButton class="btn btn-primary glow" 
																			title="#{fbresource['update']}"
																			value="#{fbresource['update']}"
																			action="#{RegistrationTableBean.updateRecord}" /></td>
																	<td><h:commandButton class="btn btn-primary glow" 
																			value="#{fbresource['delete']}"
																			id="deleteButtonAction"
																			title="#{fbresource['Click_here_to']} #{fbresource['delete']}"
																			action="#{RegistrationTableBean.deleteSeletedRecord}">
																			<o:confirmation id="buttonConfirmation"
																				message="#{fbresource['Are_you__sure_you_want_to_delete']}"
																				draggable="true" />
																		</h:commandButton></td>
																	<td><h:commandButton class="btn btn-primary glow" 
																			value="#{fbresource['Generate_Hall_Ticket']}"
																			title="#{fbresource['Click_here_to']} #{fbresource['Generate_Hall_Ticket']}"
																			action="#{RegistrationTableBean.generateHallTicket}" /></td>
																	<td><o:commandButton styleClass="btn btn-primary glow" 
																			value="#{fbresource['Result_Analysis']}"
																			id="resultAnalysis"
																			title="#{fbresource['Click_here_to']} #{fbresource['Result_Analysis']}"
																			onajaxend="document.getElementById('resultAnalysisButton').click();"
																			render="ChartWindowForm errorPanel"
																			execute="StudentForm"
																			actionListener="#{RegistrationTableBean.setResult}" /></td>
																	<td><h:commandButton class="btn btn-primary glow" 
																			title="#{fbresource['Login_as_Student']}"
																			value="#{fbresource['Login_as_Student']}"
																			id="loginAsStudentButton"
																			action="#{RegistrationTableBean.goToStudentHomePage}">
																			<o:confirmation id="loginAsStudentButtonConfirm"
																				message="#{fbresource['You_will_be_logout_and_logged_in_as_student']}"
																				draggable="true" />
																		</h:commandButton></td>
																		<td><input  type="button"  class="btn btn-primary glow"
																		value="#{fbresource['Print']}"
																		title="#{fbresource['Click_here_to']} #{fbresource['Print']}"
																		onClick="window.print()" /></td>
																	<td><h:commandButton 
																			title="#{fbresource['Generate']} #{fbresource['Excel_report']}"
																			value="#{fbresource['Excel_report']}"
																			image="/images/excel_button.png"
																			style="height:40px;width:40px;" id="generateXls"
																			action="#{RegistrationTableBean.generateXls}" /></td>
																	<td><h:commandButton 
																			title="#{fbresource['Generate']} #{fbresource['PDF_report']}"
																			value="#{fbresource['PDF_report']}"
																			image="/images/pdf_button.png"
																			style="height:40px;width:40px;"
																			action="#{RegistrationTableBean.generatePdfReport}" /></td>


																</tr>
															</table>
														</td>
													</tr>
													<tr>
														<td><h:panelGroup id="advParent">
																<h:panelGroup
																	rendered="#{param['StudentForm:addvance'] eq 'on'}">
																	<table cellSpacing="5">
																		<tr>
																			<td><h:outputText
																					value="#{fbresource['Status']}" /></td>
																			<td><h:selectOneMenu style="width:80px;"
																					value="#{RegistrationTableBean.status}" id="status">
																					<f:selectItem itemLabel="" itemValue="" />
																					<f:selectItem itemLabel="#{fbresource['Approved']}"
																						itemValue="A" />
																					<f:selectItem itemLabel="#{fbresource['Pending']}"
																						itemValue="P" />
																				</h:selectOneMenu></td>
																			<td><h:outputText
																					value="#{fbresource['Branch']}" /></td>
																			<td><h:selectOneMenu
																					value="#{RegistrationTableBean.branchName}"
																					id="branchName">
																					<f:selectItem itemLabel="" itemValue="" />
																					<c:forEach
																						items="#{CommonDBBean.getCommonData('Branch')}"
																						var="branch">
																						<f:selectItem itemLabel="#{branch}"
																							itemValue="#{branch}" />
																					</c:forEach>
																				</h:selectOneMenu></td>
																			<td><h:outputText
																					value="#{fbresource['College']}" /></td>
																			<td><h:panelGrid columns="2">
																					<h:inputText id="collegeCodeLookUpValue"
																						value="#{RegistrationTableBean.collegeName}"
																						title="#{fbresource['Please_type_your_College_Name']}">
																					</h:inputText>
																					<h:graphicImage url="/images/lookUp.png"
																						height="20px;"
																						style="cursor:hand;margin-top:10px;"
																						title="#{fbresource['Please_click_here_to_find_College_Code']}"
																						onclick="O$('collegeLookUpForm:collegeLookUp').show();" />
																				</h:panelGrid></td>
																		</tr>
																		<tr>
																			<td><h:outputText
																					value="#{fbresource['Semester']}" /></td>
																			<td><h:selectOneMenu style="width:80px;"
																					value="#{RegistrationTableBean.semester}"
																					id="semester">
																					<f:selectItem itemLabel="" itemValue="" />
																					<c:forEach
																						items="#{CommonDBBean.getCommonData('Semester')}"
																						var="semester">
																						<f:selectItem itemLabel="#{semester}"
																							itemValue="#{semester}" />
																					</c:forEach>
																				</h:selectOneMenu></td>
																			<td><h:outputText
																					value="#{fbresource['Course']}" /></td>
																			<td><h:selectOneMenu
																					value="#{RegistrationTableBean.course}" id="course">
																					<f:selectItem itemLabel="" itemValue="" />
																					<c:forEach
																						items="#{CommonDBBean.getCommonData('Course')}"
																						var="course">
																						<f:selectItem itemLabel="#{course}"
																							itemValue="#{course}" />
																					</c:forEach>
																				</h:selectOneMenu></td>

																			<td><h:outputText
																					value="#{fbresource['Pg_Course']}" /></td>
																			<td><h:selectOneMenu
																					value="#{RegistrationTableBean.pgcourse}"
																					id="pgcourse">
																					<f:selectItem itemLabel="" itemValue="" />
																					<c:forEach
																						items="#{CommonDBBean.getCommonData('Post GraduationCourse')}"
																						var="pgcourse">
																						<f:selectItem itemLabel="#{pgcourse}"
																							itemValue="#{pgcourse}" />
																					</c:forEach>
																				</h:selectOneMenu></td>
																		</tr>
																		<tr>
																			<td><h:outputText
																					value="#{fbresource['Year_of_Passing']}" /></td>
																			<td><h:selectOneMenu style="width:80px;"
																					value="#{RegistrationTableBean.yearOfPassing}"
																					id="yearOfPassing">
																					<f:selectItem itemLabel="" itemValue="" />
																					<c:forEach
																						items="#{CommonDBBean.getCommonData('YearOfPassing')}"
																						var="year">
																						<f:selectItem itemLabel="#{year}"
																							itemValue="#{year}" />
																					</c:forEach>
																				</h:selectOneMenu></td>
																			<td><h:outputText
																					value="#{fbresource['Company_Name']}" /></td>
																			<td><h:inputText id="companyName"
																					value="#{RegistrationTableBean.companyName}"
																					title="#{fbresource['Please_type_your_Company_Name']}">
																				</h:inputText></td>
																		</tr>
																	</table>
																</h:panelGroup>
															</h:panelGroup></td>
													</tr>
												</table>
												<h:panelGroup id="paginationTableContainner">
													<o:dataTable id="studentListTable" var="student"
														value="#{RegistrationTableBean.studentList}"
														sortColumnId="rollnumber" sortAscending="true"
														sortableHeaderRolloverStyle="background: #d4d4d4"
														style="width: 100%;margin-top: 10px; line-height: 17px;"
														styleClass="datatable"
														rolloverRowStyle="background: #f1f1f1;">
														<o:multipleRowSelection
															rowDatas="#{RegistrationTableBean.selectedStudentList}"
															style="background: #a4aec5; color: white;" />
														<o:columnReordering />
														<f:facet name="columnMenu">
															<o:columnMenu />
														</f:facet>
														<o:column header="#{fbresource['BL']}"
															style="text-align: center;">
															<h:graphicImage styleClass="blinking"
																title="#{fbresource['Student_is_Black_Listed']}"
																rendered="#{student.backdetails.blackList}"
																url="/images/red.png"></h:graphicImage>
															<o:popupMenu>
																<o:menuItem iconUrl="/images/icons/save-16x16.png"
																	value="#{fbresource['Add_to_Black_List']}"
																	action="#{RegistrationTableBean.addToBlackList}" />
																<o:menuItem iconUrl="/images/icons/cut-16x16.png"
																	value="#{fbresource['Delete_from_Black_List']}"
																	action="#{RegistrationTableBean.removeFromBlackList}" />
															</o:popupMenu>
														</o:column>
														<o:selectionColumn style="width: 6%;" sortable="true"
															header="#{fbresource['Selection']}">
															<f:facet name="header">
																<o:selectAllCheckbox />
															</f:facet>
														</o:selectionColumn>


														<o:column header="#{fbresource['Enrollment_No']}"
															sortingExpression="#{student.rollnumber}"
															style="text-align: center;">
															<h:commandLink style="cursor:hand;color:blue;"
																action="#{RegistrationTableBean.showInfo}"
																value="#{student.rollnumber}"
																title="#{fbresource['Please_click_here_to_see_full_information']}"></h:commandLink>
															<ui:include src="rightMenu.xhtml" />
														</o:column>
														<o:column header="#{fbresource['First_Name']}"
															sortingExpression="#{student.firstName}"
															style="text-align: center;">
															<o:hintLabel hintStyle="color:blue;font-size:15px;"
																hint="#{student.firstName}"
																value="#{student.firstName.length() gt 15 ? student.firstName.substring(0,15).concat('...') : student.firstName}" />
														</o:column>
														<o:column header="#{fbresource['Last_Name']}"
															sortingExpression="#{student.lastName}"
															style="text-align: center;">
															<o:hintLabel hintStyle="color:blue;font-size:15px;"
																hint="#{student.lastName}"
																value="#{student.lastName.length() gt 15 ? student.lastName.substring(0,15).concat('...') : student.lastName}" />
														</o:column>
														<o:column header="#{fbresource['Course']}"
															sortingExpression="#{student.personalinfo.course}"
															style="text-align: center;">
															<o:hintLabel hintStyle="color:blue;font-size:15px;"
																hint="#{student.personalinfo.course}"
																value="#{student.personalinfo.course.length() gt 15 ? student.personalinfo.course.substring(0,15).concat('...') : student.personalinfo.course}" />
														</o:column>
														<o:column header="#{fbresource['Branch']}"
															sortingExpression="#{student.personalinfo.branch}"
															style="text-align: center;">
															<o:hintLabel hintStyle="color:blue;font-size:15px;"
																hint="#{student.personalinfo.branch}"
																value="#{student.personalinfo.branch.length() gt 15 ? student.personalinfo.branch.substring(0,15).concat('...') : student.personalinfo.branch}" />
														</o:column>
														<o:column header="#{fbresource['Semester']}"
															sortingExpression="#{student.personalinfo.semester}"
															style="text-align: center;">
															<h:outputText value="#{student.personalinfo.semester}" />
														</o:column>
														<o:column header="#{fbresource['Selected_IN']}"
															sortingExpression="#{student.personalinfo.companyName}"
															style="width: 50px; text-align: left;color:blue;">
															<o:commandLink style="color:blue;" id="companyName"
																value="#{student.personalinfo.companyName}"
																title="#{fbresource['Click_here_to_see_the_Company_Details']}"
																actionListener="#{RegistrationTableBean.setCompany}"
																onajaxend="document.getElementById('companyButton').click();"
																render="companyInfo">
															</o:commandLink>
														</o:column>
														<o:column header="#{fbresource['College_Name']}"
															sortingExpression="#{student.collegeName}"
															style="text-align: center;">
															<o:hintLabel hintStyle="color:blue;font-size:15px;"
																hint="#{student.collegeName}"
																value="#{student.collegeName.length() gt 15 ? student.collegeName.substring(0,15).concat('...') : student.collegeName}" />
														</o:column>
														<o:column header="#{fbresource['Year']}"
															sortingExpression="#{student.personalinfo.yearOfPassing}"
															style="text-align: center;">
															<h:outputText
																value="#{student.personalinfo.yearOfPassing}" />
														</o:column>
														<o:column header="#{fbresource['Status']}"
															sortingExpression="#{student.approved}"
															style="text-align: center;">
															<h:outputText value="#{fbresource['Approved']}"
																rendered="#{student.approved eq true}" />
															<h:outputText value="#{fbresource['Pending']}"
																rendered="#{student.approved eq false}" />
														</o:column>
														<o:column header="#{fbresource['blocked']}"
															sortingExpression="#{student.status}"
															style="text-align: center;">
															<h:outputText value="#{fbresource['YES']}"
																rendered="#{student.status eq false}" />
															<h:outputText value="#{fbresource['NO']}"
																rendered="#{student.status eq true}" />
														</o:column>
														<f:event listener="#{RegistrationTableBean.inIt}"
															type="preRenderView" />
													</o:dataTable>
													<table align="right">
														<tr>
															<td><ui:include src="/xhtml/pagination.xhtml" /></td>
														</tr>
													</table>
												</h:panelGroup>
												<font style="margin-left: 20px;" color="red">#{fbresource['Note_Right_click_on_Enrollment_Number_for_more_options']}</font>
												<button style="display: none" id="companyButton"
													type="button" data-toggle="modal"
													data-target="#companyFullInfo" />

											</h:form>
											<h:form id="fullInfoForm">
												<!--Notice Message start -->
												<div class="modal fade text-left w-100" id="companyFullInfo"
													tabindex="-1" role="dialog"
													aria-labelledby="myModalLabel20" aria-hidden="true">
													<div
														class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-full"
														role="document">
														<div class="modal-content">
															<div class="modal-header  bg-primary">
																<h4 class="modal-title" id="myModalLabel20">#{fbresource['Company_Information']}</h4>
																<button type="button" class="close" data-dismiss="modal"
																	aria-label="Close">
																	<i class="bx bx-x"></i>
																</button>
															</div>
															<div class="modal-body">
																<h:panelGroup id="companyInfo">
																	<center>
																		<f:verbatim
																			rendered="#{RegistrationTableBean.companyObjList.size() == 0}">
																			<font color="red">#{fbresource['Company_has_been_deleted']}</font>
																			<br />
																		</f:verbatim>

																		<o:forEach
																			items="#{RegistrationTableBean.companyObjList}"
																			var="company">
																			<ui:include src="/xhtml/companyInfo.xhtml" />
																		</o:forEach>
																	</center>
																</h:panelGroup>
															</div>
															<div class="modal-footer">
																<button type="button" class="btn btn-light-secondary"
																	data-dismiss="modal">
																	<i class="bx bx-x d-block d-sm-none"></i> <span
																		class="d-none d-sm-block">#{fbresource['Close']}</span>
																</button>
															</div>
														</div>
													</div>
												</div>
												<!--Notice Message start -->
											</h:form>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</ui:define>
</ui:composition>
</html>
