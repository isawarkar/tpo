<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="adminLayoutNew.xhtml">
	<ui:define name="content">
		<h:form id="contactAndAchivmentsForm">
			<ui:include src="webflow.xhtml" />
			<section id="card-actions">
				<!-- Info table about action starts -->
				<div class="row">
					<div class="col-12">
						<div class="card">
							<div class="card-header">
								<h4 class="card-title">
									<h:outputText
										rendered="#{StudentRegistrationBean.currentMode eq 'Update'}"
										value="#{fbresource['Last_Updated_on']} #{StudentRegistrationBean.contactinfo.lastUpdated} #{fbresource['By']} #{StudentRegistrationBean.contactinfo.lastUpdatedBy}"></h:outputText>
								</h4>
								<a class="heading-elements-toggle"> <i
									class='bx bx-dots-vertical font-medium-3'></i>
								</a>
								<div class="heading-elements">
									<ul class="list-inline mb-0">
									<li><a data-action="collapse"> <i
												class="bx bx-chevron-down"></i>
										</a></li>
										<li><a data-action="expand"> <i
												class="bx bx-fullscreen"></i>
										</a></li>
										<li><a data-action="reload"> <i
												class="bx bx-revision"></i>
										</a></li>
										<li><a data-action="close"> <i class="bx bx-x"></i>
										</a></li>
									</ul>
								</div>
							</div>
							<div class="card-content collapse show">
								<div class="card-body">
									<div class="row">
										<div class="col-sm-12">
											<div class="table-responsive">
												<table width="960px">
													<tr>
														<td valign="top"><label for="phoneNumber">
																<p>#{fbresource['Phone_Number']}</p>
														</label></td>
														<td valign="top"><h:inputText maxlength="20"
																value="#{StudentRegistrationBean.contactinfo.phoneNumber}"
																id="phoneNumber" /> <o:floatingIconMessage
																style="border-color: red;" for="phoneNumber"
																showDetail="true" showSummary="false" /></td>
														<td valign="top"><label for="mobileNumber">
																<p>
																	#{fbresource['Mobile']}<font color="red">*</font>
																</p>
														</label></td>
														<td valign="top"><h:panelGroup id="mobileGroup">
																<h:inputText required="true" maxlength="10"
																	immediate="true"
																	value="#{StudentRegistrationBean.contactinfo.mobileNumber}"
																	id="mobileNumber">
																	<f:validateLength minimum="10" />
																</h:inputText>
																<input type="hidden" name="oldMobileNumber"
																	value="#{StudentRegistrationBean.contactinfo.mobileNumber}" />
																<o:floatingIconMessage style="border-color: red;"
																	for="mobileNumber" showDetail="true"
																	showSummary="false" />
																<h:graphicImage
																	rendered="#{StudentRegistrationBean.contactinfo.numberVerified eq true and StudentRegistrationBean.currentMode eq 'Update'}"
																	title="#{fbresource['Verified_Mobile_Number']}"
																	height="15px;" width="15px;" url="/css/success.png" />
																<h:graphicImage styleClass="blinking"
																	rendered="#{StudentRegistrationBean.contactinfo.numberVerified eq false and StudentRegistrationBean.currentMode eq 'Update'}"
																	title="#{fbresource['Mobile_Number_is_not_verified']}"
																	height="15px;" width="15px;" url="/css/error.png" />
																<o:commandButton styleClass="btn btn-primary glow"  execute="mobileGroup"
																	render="mobileGroup"
																	action="#{StudentRegistrationBean.verifyNumberFromAdmin}"
																	title="#{fbresource['Your_number_is_not_verified']}"
																	rendered="#{StudentRegistrationBean.contactinfo.numberVerified eq false and StudentRegistrationBean.currentMode eq 'Update' and StudentRegistrationBean.isSmsEnabled eq 'YES'}"
																	value="#{fbresource['Verify']}" />
															</h:panelGroup></td>
													</tr>

													<tr>
														<td><label for="email">
																<p>
																	#{fbresource['Email_ID']}<font color="red">*</font>
																</p>
														</label></td>
														<td><h:inputText immediate="true" size="30"
																title="#{fbresource['It_is_important_to_add_valid_Email']}"
																value="#{StudentRegistrationBean.registration.email}"
																maxlength="100" id="email" required="true"
																requiredMessage="#{fbresource['Please_enter']} #{fbresource['Email_ID']}">
																<f:validator validatorId="EmailValidator" />
															</h:inputText> <o:floatingIconMessage style="border-color: red;"
																for="email" showDetail="true" showSummary="false" /> <input
															type="hidden" name="oldEmail"
															value="#{StudentRegistrationBean.registration.email}" />
														</td>
														<td><o:commandButton styleClass="btn btn-primary glow"  execute="@this"
																title="#{fbresource['Your_Email_is_not_verified']}"
																rendered="#{StudentRegistrationBean.registration.emailVarified eq false}"
																value="#{fbresource['Verify_Email']}"
																action="#{StudentRegistrationBean.sendEmail}"
																render="errorPanel">
															</o:commandButton> <f:verbatim
																rendered="#{StudentRegistrationBean.registration.emailVarified eq true}">
																<font color="green" size="3">#{fbresource['Verified_EMail']}</font>
															</f:verbatim></td>
														<td><label>
																<p>
																	<font color="red">#{fbresource['It_is_important_to_add_valid_Email']}</font>
																</p>
														</label></td>

													</tr>

													<tr>
														<td valign="top"><label for="hieght">
																<p>
																	#{fbresource['Height']}<font color="red">*</font>
																</p>
														</label></td>
														<td valign="top"><h:inputText immediate="true"
																size="2" maxlength="3"
																value="#{StudentRegistrationBean.contactinfo.hieght}"
																id="height" required="true"
																requiredMessage="#{fbresource['Please_enter']} #{fbresource['Height']}">
															</h:inputText> <o:floatingIconMessage style="border-color: red;"
																for="height" showDetail="true" showSummary="false" /></td>

														<td valign="top"><label for="postGraduationBranch">
																<p>
																	#{fbresource['Weight']}<font color="red">*</font>
																</p>
														</label></td>
														<td valign="top"><h:inputText immediate="true"
																size="2" maxlength="3"
																value="#{StudentRegistrationBean.contactinfo.weight}"
																id="weight" required="true"
																requiredMessage="#{fbresource['Please_enter']} #{fbresource['Weight']}">
															</h:inputText> <o:floatingIconMessage style="border-color: red;"
																for="weight" showDetail="true" showSummary="false" /></td>
													</tr>
													<tr>
														<td valign="top"><label for="glassPowerLeft">
																<p>
																	#{fbresource['Glass_Power_L']}<font color="red">*</font>
																</p>
														</label></td>
														<td valign="top"><o:dropDownField id="glassPowerLeft"
																maxlength="6" required="true" immediate="true"
																style="width: 80px;"
																listItemStyle="white-space: nowrap;"
																suggestionMode="stringStart" var="glassPowerLeft"
																value="#{StudentRegistrationBean.contactinfo.glassPowerLeft}"
																suggestionMinChars="1">
																<o:dropDownItems
																	value="#{CommonDBBean.getCommonData('GlassPower')}" />
																<o:column>
																	<h:outputText value="#{glassPowerLeft}"
																		styleClass="dropDownValuesClass" />
																</o:column>
															</o:dropDownField> <o:floatingIconMessage style="border-color: red;"
																for="glassPowerLeft" showDetail="true"
																showSummary="false" /></td>

														<td valign="top"><label for="glassPowerRight">
																<p>
																	#{fbresource['Glass_Power_R']}<font color="red">*</font>
																</p>
														</label></td>
														<td valign="top"><o:dropDownField
																id="glassPowerRight" maxlength="6" required="true"
																immediate="true" style="width: 80px;"
																listItemStyle="white-space: nowrap;"
																suggestionMode="stringStart" var="glassPowerRight"
																value="#{StudentRegistrationBean.contactinfo.glassPowerRight}"
																suggestionMinChars="1">
																<o:dropDownItems
																	value="#{CommonDBBean.getCommonData('GlassPower')}" />
																<o:column>
																	<h:outputText value="#{glassPowerRight}"
																		styleClass="dropDownValuesClass" />
																</o:column>
															</o:dropDownField> <o:floatingIconMessage style="border-color: red;"
																for="glassPowerRight" showDetail="true"
																showSummary="false" /></td>
													</tr>

													<tr>
														<td valign="top"><label for="presentAddress">
																<p>
																	#{fbresource['Present_Address']}<font color="red">*</font>
																</p>
														</label></td>
														<td valign="top"><h:inputTextarea rows="2"
																immediate="true"
																value="#{StudentRegistrationBean.contactinfo.presentAddress}"
																maxlength="100" id="presentAddress" required="true"
																requiredMessage="#{fbresource['Please_enter']} #{fbresource['Present_Address']}">
															</h:inputTextarea> <o:floatingIconMessage style="border-color: red;"
																for="presentAddress" showDetail="true"
																showSummary="false" /></td>
														<td valign="top"><label for="permanentAddress">
																<p>
																	#{fbresource['Permanent_Address']}<font color="red">*</font>
																</p>
														</label></td>
														<td valign="top"><h:inputTextarea rows="2"
																immediate="true"
																value="#{StudentRegistrationBean.contactinfo.permanentAddress}"
																maxlength="100" id="permanentAddress" required="true"
																requiredMessage="#{fbresource['Please_enter']} #{fbresource['Permanent_Address']}">
															</h:inputTextarea> <o:floatingIconMessage style="border-color: red;"
																for="permanentAddress" showDetail="true"
																showSummary="false" /></td>
													</tr>

													<tr>
														<td valign="top"><label for="presentCity">
																<p>
																	#{fbresource['Present_City']}<font color="red">*</font>
																</p>
														</label></td>
														<td valign="top"><h:inputText immediate="true"
																value="#{StudentRegistrationBean.contactinfo.presentCity}"
																maxlength="50" id="presentCity" required="true"
																requiredMessage="#{fbresource['Please_enter']} #{fbresource['Present_City']}">
															</h:inputText> <o:floatingIconMessage style="border-color: red;"
																for="presentCity" showDetail="true" showSummary="false" /></td>
														<td valign="top"><label for="permanentCity">
																<p>
																	#{fbresource['Permanent_City']}<font color="red">*</font>
																</p>
														</label></td>
														<td valign="top"><h:inputText immediate="true"
																value="#{StudentRegistrationBean.contactinfo.permanentCity}"
																maxlength="50" id="permanentCity" required="true"
																requiredMessage="#{fbresource['Please_enter']} #{fbresource['Permanent_City']}">
															</h:inputText> <o:floatingIconMessage style="border-color: red;"
																for="permanentCity" showDetail="true"
																showSummary="false" /></td>
													</tr>
													<tr>
														<td valign="top"><label for="presentState">
																<p>
																	#{fbresource['Present_State']}<font color="red">*</font>
																</p>
														</label></td>
														<td valign="top"><o:dropDownField id="presentState"
																maxlength="50" required="true" immediate="true"
																style="width: 200px;"
																listItemStyle="white-space: nowrap;"
																suggestionMode="stringStart" var="presentState"
																value="#{StudentRegistrationBean.contactinfo.presentState}"
																suggestionMinChars="1">
																<o:dropDownItems
																	value="#{CommonDBBean.getCommonData('State')}" />
																<o:column>
																	<h:outputText value="#{presentState}"
																		styleClass="dropDownValuesClass" />
																</o:column>
															</o:dropDownField> <o:floatingIconMessage style="border-color: red;"
																for="presentState" showDetail="true" showSummary="false" /></td>
														<td valign="top"><label for="permanentState">
																<p>
																	#{fbresource['Permanent_State']}<font color="red">*</font>
																</p>
														</label></td>
														<td valign="top"><o:dropDownField id="permanentState"
																required="true" immediate="true" style="width: 200px;"
																listItemStyle="white-space: nowrap;" maxlength="50"
																suggestionMode="stringStart" var="permanentState"
																value="#{StudentRegistrationBean.contactinfo.permanentState}"
																suggestionMinChars="1">
																<o:dropDownItems
																	value="#{CommonDBBean.getCommonData('State')}" />
																<o:column>
																	<h:outputText value="#{permanentState}"
																		styleClass="dropDownValuesClass" />
																</o:column>
															</o:dropDownField> <o:floatingIconMessage style="border-color: red;"
																for="permanentState" showDetail="true"
																showSummary="false" /></td>
													</tr>
												</table>
												<table>
													<tr>
														<td><o:commandButton styleClass="btn btn-primary glow" 
																action="#{StudentRegistrationBean.updateContactInformation}"
																value="#{fbresource['Update_Contact_Information']}" /></td>
													</tr>
												</table>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
			<section id="card-actions">
				<!-- Info table about action starts -->
				<div class="row">
					<div class="col-12">
						<div class="card">
							<div class="card-header">
								<h4 class="card-title">
									<h:outputText
										rendered="#{StudentRegistrationBean.currentMode eq 'Update'}"
										value="#{fbresource['Last_Updated_on']} #{StudentRegistrationBean.achivements.lastUpdated} #{fbresource['By']} #{StudentRegistrationBean.achivements.lastUpdatedBy}"></h:outputText>
								</h4>
								<a class="heading-elements-toggle"> <i
									class='bx bx-dots-vertical font-medium-3'></i>
								</a>
								<div class="heading-elements">
									<ul class="list-inline mb-0">
									<li><a data-action="collapse"> <i
												class="bx bx-chevron-down"></i>
										</a></li>
										<li><a data-action="expand"> <i
												class="bx bx-fullscreen"></i>
										</a></li>
										<li><a data-action="reload"> <i
												class="bx bx-revision"></i>
										</a></li>
										<li><a data-action="close"> <i class="bx bx-x"></i>
										</a></li>
									</ul>
								</div>
							</div>
							<div class="card-content collapse show">
								<div class="card-body">
									<div class="row">
										<div class="col-sm-12">
											<div class="table-responsive">
												<table width="960px">
													<tr>
														<td valign="top"><label for="academic">
																<p>#{fbresource['Academic']}</p>
														</label></td>
													</tr>
													<tr>
														<td valign="top"><h:panelGrid width="900px">
																<h:inputTextarea rows="5" cols="80" immediate="true"
																	value="#{StudentRegistrationBean.achivements.acedamic}"
																	maxlength="1000" id="academic">
																</h:inputTextarea>
															</h:panelGrid></td>
													</tr>
													<tr>
														<td valign="top"><label for="sports">
																<p>#{fbresource['Sports']}</p>
														</label></td>
													</tr>
													<tr>
														<td valign="top"><h:panelGrid width="900px">
																<h:inputTextarea rows="5" cols="80" immediate="true"
																	value="#{StudentRegistrationBean.achivements.sports}"
																	maxlength="1000" id="sports">
																</h:inputTextarea>
															</h:panelGrid></td>
													</tr>
													<tr>
														<td valign="top"><label for="others">
																<p>#{fbresource['Others']}</p>
														</label></td>
													</tr>
													<tr>
														<td valign="top"><h:panelGrid width="900px">
																<h:inputTextarea rows="5" cols="80" immediate="true"
																	value="#{StudentRegistrationBean.achivements.others}"
																	maxlength="1000" id="others">
																</h:inputTextarea>
															</h:panelGrid></td>
													</tr>

												</table>
												<table>
													<tr>
														<td><o:commandButton styleClass="btn btn-primary glow" 
																title="#{fbresource['Previous_Page']}"
																value="#{fbresource['Previous_Page']}"
																action="#{WebFlow.thirdPage}" /></td>
														<td><o:commandButton styleClass="btn btn-primary glow" 
																title="#{fbresource['Next_Page']}"
																value="#{fbresource['Next_Page']}"
																action="#{WebFlow.allDocumentPage}" /></td>
														<td><o:commandButton styleClass="btn btn-primary glow" 
																action="#{StudentRegistrationBean.updateAchivementsInformation}"
																value="#{fbresource['Update_Achievement_Information']}" /></td>
														<td><o:commandButton styleClass="btn btn-primary glow" 
																rendered="#{StudentRegistrationBean.currentMode eq 'Update'}"
																action="#{StudentRegistrationBean.saveRecord}"
																value="#{fbresource['Update_All_the_Sections']}" /></td>
													</tr>
												</table>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
		</h:form>
		<script>
				CKEDITOR.replace('contactAndAchivmentsForm:academic');
				CKEDITOR.replace('contactAndAchivmentsForm:sports');
				CKEDITOR.replace('contactAndAchivmentsForm:others');
			</script>
	</ui:define>
</ui:composition>
</html>
