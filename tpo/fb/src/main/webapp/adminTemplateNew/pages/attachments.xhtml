<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<h:form id="AttachmentForm" prependId="false" enctype="multipart/form-data">
	<o:window 
		id="AttachmentFormWindow" resizable="true" width="1050px"
		height="450px" styleClass="window"
		caption="#{fbresource['selectAttachment']}"
		captionStyle="background: #bbbbbb;
                            border-bottom: #e9e9e9 solid 1px;
                            position: relative;
                            padding: 0 0 0 6px;
                            color: white;"
		modal="true" modalLayerClass="modalLayer">
		<o:captionArea>
			<o:minimizeWindowButton minimizeImageUrl="/images/win_minimize.png"
				restoreImageUrl="./images/win_restore.jpg" styleClass="customButton"
				rolloverClass="buttonRollover" />
			<o:maximizeWindowButton maximizeImageUrl="/images/win_maximize.png"
				restoreImageUrl="images/win_restore.jpg" styleClass="customButton"
				rolloverClass="buttonRollover" />
			<o:closeWindowButton imageUrl="/images/win_close.png"
				styleClass="customButton" rolloverClass="buttonRollover" />
		</o:captionArea>
		<ui:include src="/xhtml/errorPanel.xhtml" />
		<fieldset>
			<legend>#{fbresource['selectAttachment']}</legend>
			<table align="center" styleClass="registration_table" cellPadding="2">

				<tr>
					<td>#{fbresource['selectAttachment']} 1</td>

					<td><h:inputFile id="file1"
							value="#{EmailAttachmentBean.file1}" /></td>
				</tr>
				<tr>
					<td>#{fbresource['selectAttachment']} 2</td>

					<td><h:inputFile id="file2"
							value="#{EmailAttachmentBean.file2}" /></td>
				</tr>
				<tr>
					<td>#{fbresource['selectAttachment']} 3</td>

					<td><h:inputFile id="file3"
							value="#{EmailAttachmentBean.file3}" /></td>
				</tr>
				<tr>
					<td>#{fbresource['selectAttachment']} 4</td>

					<td><h:inputFile id="file4"
							value="#{EmailAttachmentBean.file4}" /></td>
				</tr>
				<tr>
					<td>#{fbresource['selectAttachment']} 5</td>

					<td><h:inputFile id="file5"
							value="#{EmailAttachmentBean.file5}" /></td>
				</tr>
			</table>
			<h:commandButton class="btn btn-primary glow"  title="#{fbresource['Please_click_here_to_Attach']}"
				id="attachmentRecord" value="#{fbresource['submit']}"
				action="#{EmailAttachmentBean.attach}" />
			<h:commandButton class="btn btn-primary glow"  type="button" style="margin-left:5px; margin-top:10px;"
				onclick=" O$('AttachmentFormWindow').hide();"
				title="#{fbresource['Please_click_here_to_close_this_window']}"
				value="#{fbresource['Close']}" />
		</fieldset>
	</o:window>
</h:form>
</html>
