<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<h:form id="ChartWindowForm">
	<o:window rendered="#{OpenningListTableBean.resultAnalysis ne null}" id="Chart"
		resizable="true" width="1050px" height="600px" styleClass="window"
		caption="#{fbresource['Campus_Analysis']}"
		captionStyle="background: #bbbbbb;
                            border-bottom: #e9e9e9 solid 1px;
                            position: relative;
                            padding: 0 0 0 6px;
                            color: white;"
		modal="true" modalLayerClass="modalLayer">

		<o:captionArea>
			<o:minimizeWindowButton minimizeImageUrl="/images/win_minimize.png"
				restoreImageUrl="./images/win_restore.jpg" styleClass="customButton"
				rolloverClass="buttonRollover" />
			<o:maximizeWindowButton maximizeImageUrl="/images/win_maximize.png"
				restoreImageUrl="images/win_restore.jpg" styleClass="customButton"
				rolloverClass="buttonRollover" />
			<o:closeWindowButton imageUrl="/images/win_close.png"
				styleClass="customButton" rolloverClass="buttonRollover" />
		</o:captionArea>
		<ui:include src="/xhtml/errorPanel.xhtml" />

		<fieldset>
			<legend>#{fbresource['Campus_Analysis']}</legend>
			<h:panelGrid columns="2">
			<o:chart rendered="#{OpenningListTableBean.resultAnalysis ne null}"
				style="marging-left:1000px;" height="300" width="500"
				model="#{OpenningListTableBean.resultAnalysis}" view="bar"
				titleText="#{fbresource['Campus_Analysis']}(#{OpenningListTableBean.hallTicketId}-#{OpenningListTableBean.chartCompanyName})">
				<o:barChartView colors="cyan,green,orange" labelsVisible="true" enable3D="true"
					shadowColor="green" />
			</o:chart>
			<o:chart rendered="#{OpenningListTableBean.resultPieAnalysis ne null}"
				style="marging-left:1000px;" height="300" width="500"
				model="#{OpenningListTableBean.resultPieAnalysis}" view="pie"
				titleText="#{fbresource['Campus_Analysis']}(#{OpenningListTableBean.hallTicketId}-#{OpenningListTableBean.chartCompanyName})">
				<o:pieChartView colors="orange,green,cyan" labelsVisible="true" tooltip="#{sector.key} - #{sector.value}" />
			</o:chart>
			</h:panelGrid>
			<table halign="center">
				<tr>
					<td><h:commandButton class="btn btn-primary glow"  value="#{fbresource['Close']}"
							type="button" onclick="O$('ChartWindowForm:Chart').hide();"
							title="#{fbresource['Please_click_here_to_close']}" /></td>
				</tr>
			</table>
		</fieldset>
	</o:window>
</h:form>
</html>
