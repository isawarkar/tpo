<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="adminLayoutNew.xhtml">
	<ui:define name="content">
		<ui:include src="/xhtml/allPopUps.xhtml" />
		<section id="card-actions">
			<!-- Info table about action starts -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">#{fbresource['Notice_List']}</h4>
							<a class="heading-elements-toggle"> <i
								class='bx bx-dots-vertical font-medium-3' /></a>
							<div class="heading-elements">
								<ul class="list-inline mb-0">
									<li><h:form>
											<h:panelGroup id="bookmarkButtonPanel">
												<o:commandLink id="bookmarkButton" execute="bookmarkButton"
													render="bookmarkButtonPanel bookmarkList errorPanel"
													actionListener="#{BookmarkBean.setBookmark}">
													<f:param name="bookmarkName" value="noticeList" />

													<i title="#{fbresource['bookmarkToolTip']}"
														class="ficon bx #{BookmarkBean.getIcon('noticeList')} warning" />
												</o:commandLink>
											</h:panelGroup>
										</h:form></li>
									<li><a data-action="collapse"> <i
											class="bx bx-chevron-down" /></a></li>
									<li><a data-action="expand"> <i
											class="bx bx-fullscreen" /></a></li>
									<li><a data-action="reload"> <i class="bx bx-revision" /></a></li>
									<li><a data-action="close"> <i class="bx bx-x" /></a></li>
								</ul>
							</div>
						</div>
						<div class="card-content collapse show">
							<div class="card-body">
								<div class="row">
									<div class="col-sm-12">
										<div class="table-responsive">
											<h:form id="NoticeForm">
												<table cellSpacing="5">
													<tr>
														<td><h:outputText
																value="#{fbresource['Notice_Name']}" /></td>
														<td><h:inputText
																value="#{NoticeTableBean.noticeName}" id="noticeName" /></td>
														<td><h:commandButton class="btn btn-primary glow"
																value="#{fbresource['search']}"
																title="#{fbresource['Click_here_to']} #{fbresource['Search_Record']}"
																action="#{NoticeTableBean.searchRecord}" /></td>
														<td><o:commandButton
																styleClass="btn btn-primary glow"
																value="#{fbresource['add']}" id="addNotice"
																title="#{fbresource['Click_here_to']} #{fbresource['add']}"
																onajaxend="document.getElementById('ShowNoticeButton1').click();"
																render="NoticeBoardForm"
																actionListener="#{NoticeTableBean.setNoticeToAdd}" /></td>
														<td><o:commandButton
																styleClass="btn btn-primary glow"
																value="#{fbresource['View']}" id="View"
																title="#{fbresource['Click_here_to']} #{fbresource['View']}"
																onajaxend="showNotice('noticeButton');"
																execute="noticeListTable" render="noticeForm errorPanel"
																actionListener="#{NoticeTableBean.setNoticeObj}" /></td>
														<td><o:commandButton
																styleClass="btn btn-primary glow"
																value="#{fbresource['update']}" id="update"
																title="#{fbresource['Click_here_to']} #{fbresource['update']}"
																onajaxend="document.getElementById('ShowNoticeButton1').click();"
																execute="noticeListTable"
																render="NoticeBoardForm errorPanel"
																actionListener="#{NoticeTableBean.setNotice}" /></td>
														<td><h:commandButton class="btn btn-primary glow"
																value="#{fbresource['delete']}" id="deleteButtonAction"
																title="#{fbresource['Click_here_to']} #{fbresource['delete']}"
																action="#{NoticeTableBean.deleteSeletedRecord}">
																<o:confirmation id="buttonConfirmation"
																	message="#{fbresource['Are_you__sure_you_want_to_delete']}"
																	draggable="true" />
															</h:commandButton></td>
														<td><h:commandButton class="btn btn-primary glow"
																value="#{fbresource['Change_Status']}" id="changeStatus"
																title="#{fbresource['Click_here_to']} #{fbresource['Change_Status']}"
																action="#{NoticeTableBean.changeStatus}">
																<o:confirmation id="changeStatusConfirm"
																	message="#{fbresource['Are_you__sure_you_want_to_Change_Status']}"
																	draggable="true" />
															</h:commandButton></td>
														<td><input type="button"
															value="#{fbresource['Print']}"
															class="btn btn-primary glow"
															title="#{fbresource['Click_here_to']} #{fbresource['Print']}"
															onClick="window.print()" /></td>
														<td><h:commandButton
																title="#{fbresource['Generate']} #{fbresource['Excel_report']}"
																value="#{fbresource['Excel_report']}"
																image="/images/excel_button.png"
																style="height:40px;width:40px;" id="generateXls"
																action="#{NoticeTableBean.generateXls}" /></td>
														<td><h:commandButton
																title="#{fbresource['Generate']} #{fbresource['PDF_report']}"
																value="#{fbresource['PDF_report']}"
																image="/images/pdf_button.png"
																style="height:40px;width:40px;"
																action="#{NoticeTableBean.generatePdfReport}" /></td>
													</tr>
												</table>
												<h:panelGroup id="paginationTableContainner">
													<o:dataTable id="noticeListTable" var="notice"
														value="#{NoticeTableBean.noticeList}"
														sortColumnId="noticeName" sortAscending="true"
														sortableHeaderRolloverStyle="background: #d4d4d4"
														style="width: 100%; line-height: 17px;"
														styleClass="datatable"
														rolloverRowStyle="background: #f1f1f1;">
														<o:multipleRowSelection
															rowDatas="#{NoticeTableBean.selectedNoticeList}"
															style="background: #a4aec5; color: white;" />
														<o:columnReordering />
														<f:facet name="columnMenu">
															<o:columnMenu />
														</f:facet>
														<o:selectionColumn style="width: 6%;" sortable="true"
															header="#{fbresource['Selection']}">
															<f:facet name="header">
																<o:selectAllCheckbox />
															</f:facet>
														</o:selectionColumn>
														<o:column header="#{fbresource['Notice_Name']}"
															sortingExpression="#{notice.noticeName}"
															style="text-align: left;">
															<o:hintLabel hintStyle="color:blue;font-size:15px;"
																hint="#{notice.noticeName}"
																value="#{notice.noticeName.length() gt 70 ? notice.noticeName.substring(0,70).concat('...') : notice.noticeName}" />
														</o:column>
														<o:column header="#{fbresource['Status']}"
															sortingExpression="#{notice.active}"
															style="text-align: center;">
															<h:outputText rendered="#{notice.active eq true}"
																value="#{fbresource['Active']}" />
															<h:outputText rendered="#{notice.active eq false}"
																value="#{fbresource['InActive']}" />
														</o:column>
														<o:column header="#{fbresource['Expiry']}"
															sortingExpression="#{notice.expiryDate}"
															style="text-align: center;">
															<h:outputText style="color:red;"
																rendered="#{notice.className ne ''}"
																styleClass="#{notice.className}"
																value="#{notice.expiryDate}">
																<f:convertDateTime pattern="dd/MM/yyyy" />
															</h:outputText>
															<h:outputText style="color:green;"
																rendered="#{notice.className eq ''}"
																styleClass="#{notice.className}"
																value="#{notice.expiryDate}">
																<f:convertDateTime pattern="dd/MM/yyyy" />
															</h:outputText>
														</o:column>
														<o:column header="#{fbresource['EXP']}"
															sortingExpression="#{notice.className}"
															style="text-align: center;">
															<h:graphicImage styleClass="blinking"
																title="#{fbresource['Expired']}"
																rendered="#{notice.className ne ''}"
																url="/images/red_expired.png" />
														</o:column>
														<o:column header="#{fbresource['SS']}"
															sortingExpression="#{notice.studentSpecific}"
															style="text-align: center;">
															<h:outputText
																value="#{notice.studentSpecific ? 'YES' : 'NO'}" />
														</o:column>
														<o:column header="#{fbresource['IMP']}"
															sortingExpression="#{notice.impTag}"
															style="text-align: center;">
															<h:outputText value="#{notice.impTag ? 'YES' : 'NO'}" />
														</o:column>
														<o:column header="#{fbresource['File1']}"
															sortingExpression="#{notice.fileName1}"
															style="text-align: center;">
															<o:commandLink
																actionListener="#{StudentRegistrationBean.setFileNameAndNotice}"
																onajaxend="document.getElementById('fileButton').click();"
																render="fileFullInfo" style="font-size:20px;color:blue;">
																<f:param name="fileName1" value="#{notice.fileName1}" />
																<f:param name="notice" value="#{notice}" />
											#{notice.fileName1}
								</o:commandLink>
														</o:column>
														<o:column header="#{fbresource['File2']}"
															sortingExpression="#{notice.fileName2}"
															style="text-align: center;">
															<o:commandLink
																actionListener="#{StudentRegistrationBean.setFileNameAndNotice}"
																onajaxend="document.getElementById('fileButton').click();"
																render="fileFullInfo" style="font-size:20px;color:blue;">
																<f:param name="fileName1" value="#{notice.fileName2}" />
																<f:param name="notice" value="#{notice}" />
											#{notice.fileName2}
								</o:commandLink>
														</o:column>
														<o:column header="#{fbresource['File3']}"
															sortingExpression="#{notice.fileName3}"
															style="text-align: center;">
															<o:commandLink
																actionListener="#{StudentRegistrationBean.setFileNameAndNotice}"
																onajaxend="document.getElementById('fileButton').click();"
																render="fileFullInfo" style="font-size:20px;color:blue;">
																<f:param name="fileName1" value="#{notice.fileName3}" />
																<f:param name="notice" value="#{notice}" />
											#{notice.fileName3}
								</o:commandLink>
														</o:column>
														<o:column header="#{fbresource['File4']}"
															sortingExpression="#{notice.fileName4}"
															style="text-align: center;">
															<o:commandLink
																actionListener="#{StudentRegistrationBean.setFileNameAndNotice}"
																onajaxend="document.getElementById('fileButton').click();"
																render="fileFullInfo" style="font-size:20px;color:blue;">
																<f:param name="fileName1" value="#{notice.fileName4}" />
																<f:param name="notice" value="#{notice}" />
											#{notice.fileName4}
								</o:commandLink>
														</o:column>
														<o:column header="#{fbresource['File5']}"
															sortingExpression="#{notice.fileName5}"
															style="text-align: center;">
															<o:commandLink
																actionListener="#{StudentRegistrationBean.setFileNameAndNotice}"
																onajaxend="document.getElementById('fileButton').click();"
																render="fileFullInfo" style="font-size:20px;color:blue;">
																<f:param name="fileName1" value="#{notice.fileName5}" />
																<f:param name="notice" value="#{notice}" />
											#{notice.fileName5}
								</o:commandLink>
														</o:column>

														<o:column header="#{fbresource['created_By']}"
															sortingExpression="#{notice.createdBy}"
															style="text-align: center;">
															<h:outputText rendered="#{!notice.studentSpecific}" value="#{notice.createdBy}" />
															<h:outputText rendered="#{notice.studentSpecific}" style="color:red;" value="#{notice.createdBy}" title="#{fbresource['Notice_Message']}  #{fbresource['studentSpecific']}" />
														</o:column>

														<f:event listener="#{NoticeTableBean.inIt}"
															type="preRenderView" />
													</o:dataTable>
													<table align="right">
														<tr>
															<td><ui:include src="/xhtml/pagination.xhtml" /></td>
														</tr>
													</table>
												</h:panelGroup>
												<font style="margin-left: 20px;" color="red">*#{fbresource['SS']} = #{fbresource['studentSpecific']}</font>
												
												<font style="margin-left: 20px;" color="red">*#{fbresource['IMP']} = #{fbresource['Important_Notices']}</font>
												
												<font style="margin-left: 20px;" color="red">*#{fbresource['EXP']} = #{fbresource['Expired']}</font>
											</h:form>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</ui:define>
</ui:composition>
</html>
