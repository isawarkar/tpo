<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="adminLayoutNew.xhtml">
	<ui:define name="content">
		<section id="card-actions">
			<!-- Info table about action starts -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">#{fbresource['Short_History_List']}</h4>
							<a class="heading-elements-toggle"> <i
								class='bx bx-dots-vertical font-medium-3' /></a>
							<div class="heading-elements">
								<ul class="list-inline mb-0">
									<li><h:form>
											<h:panelGroup id="bookmarkButtonPanel">
												<o:commandLink id="bookmarkButton" execute="bookmarkButton"
													render="bookmarkButtonPanel bookmarkList errorPanel"
													actionListener="#{BookmarkBean.setBookmark}">
													<f:param name="bookmarkName" value="shortRecordHistoryList" />
													
													<i title="#{fbresource['bookmarkToolTip']}"
														class="ficon bx #{BookmarkBean.getIcon('shortRecordHistoryList')} warning" />
												</o:commandLink>
											</h:panelGroup>
										</h:form></li>
									<li><a data-action="collapse"> <i
											class="bx bx-chevron-down" /></a></li>
									<li><a data-action="expand"> <i
											class="bx bx-fullscreen" /></a></li>
									<li><a data-action="reload"> <i class="bx bx-revision" /></a></li>
									<li><a data-action="close"> <i class="bx bx-x" /></a></li>
								</ul>
							</div>
						</div>
						<div class="card-content collapse show">
							<div class="card-body">
								<div class="row">
									<div class="col-sm-12">
										<div class="table-responsive">
											<h:form id="ShortRecordForm">
												<table cellSpacing="5">
													<tr>
														<td><h:outputText value="#{fbresource['File_Name']}" /></td>
														<td><h:inputText
																value="#{ShortRecordTableBean.fileName}" id="fileName"
																columns="15" maximumLength="12">
															</h:inputText></td>
														<td><h:commandButton class="btn btn-primary glow"
																value="#{fbresource['search']}"
																title="#{fbresource['Click_here_to']} #{fbresource['Search_Record']}"
																action="#{ShortRecordTableBean.searchRecord}" /></td>
														<td><h:commandButton class="btn btn-primary glow"
																value="#{fbresource['delete']}" id="deleteButtonAction"
																title="#{fbresource['Click_here_to']} #{fbresource['delete']}"
																action="#{ShortRecordTableBean.deleteSeletedRecord}">
																<o:confirmation id="buttonConfirmation"
																	message="#{fbresource['Are_you__sure_you_want_to_delete']}"
																	draggable="true" />
															</h:commandButton></td>
														<td><input type="button"
															value="#{fbresource['Print']}"
															class="btn btn-primary glow"
															title="#{fbresource['Click_here_to']} #{fbresource['Print']}"
															onClick="window.print()" /></td>
													</tr>
												</table>
												<h:panelGroup id="paginationTableContainner">
													<o:dataTable id="comapanyListTable" var="shortRecord"
														value="#{ShortRecordTableBean.shortRecordList}"
														sortColumnId="fileName" sortAscending="true"
														sortableHeaderRolloverStyle="background: #d4d4d4"
														style="width: 100%; line-height: 17px;"
														styleClass="datatable"
														rolloverRowStyle="background: #f1f1f1;">
														<o:multipleRowSelection
															rowDatas="#{ShortRecordTableBean.selectedShortRecordList}"
															style="background: #a4aec5; color: white;" />
														<o:columnReordering />
														<f:facet name="columnMenu">
															<o:columnMenu />
														</f:facet>
														<o:selectionColumn style="width: 6%;" sortable="true"
															header="#{fbresource['Selection']}">
															<f:facet name="header">
																<o:selectAllCheckbox />
															</f:facet>
														</o:selectionColumn>
														<o:column header="#{fbresource['File_Name']}"
															sortingExpression="#{shortRecord.fileName}"
															style="text-align: center;">
															<h:panelGrid columns="2">
															<h:graphicImage url="/images/xls-icon.gif"
																	title="#{fbresource['Excel_Report']}" />
															<h:commandLink value="#{shortRecord.fileName}"
																id="fileName"
																style="font-family: arial, helvetica, verdana, sans-serif;color: blue;font-size: 15px;"
																action="#{ShortRecordTableBean.renderShortReport}" />
																</h:panelGrid>
														</o:column>
														<o:column header="#{fbresource['Company_Name']}"
															sortingExpression="#{shortRecord.companyName}"
															style="text-align: center;">
															<o:hintLabel hintStyle="color:blue;font-size:15px;"
																hint="#{shortRecord.companyName}"
																value="#{shortRecord.companyName.length() gt 20 ? shortRecord.companyName.substring(0,20).concat('...') : shortRecord.companyName}" />
														</o:column>
														<o:column header="#{fbresource['Date_of_Shorting_File']}"
															sortingExpression="#{shortRecord.dateOfShort}"
															style="text-align: center;">
															<h:outputText value="#{shortRecord.dateOfShort}">
																<f:convertDateTime pattern="dd/MM/yyyy" />
															</h:outputText>
														</o:column>
														<f:event listener="#{ShortRecordTableBean.inIt}"
															type="preRenderView" />
													</o:dataTable>
													<table align="right">
														<tr>
															<td><ui:include src="/xhtml/pagination.xhtml" /></td>
														</tr>
													</table>
												</h:panelGroup>
											</h:form>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</ui:define>
</ui:composition>
</html>
