<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="adminLayoutNew.xhtml">
	<ui:define name="content">
		<ui:include src="/xhtml/allPopUps.xhtml" />

		<section id="card-actions">
			<!-- Info table about action starts -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">#{fbresource['User_List']}</h4>
							<a class="heading-elements-toggle"> <i
								class='bx bx-dots-vertical font-medium-3' /></a>
							<div class="heading-elements">
								<ul class="list-inline mb-0">
									<li><h:form>
											<h:panelGroup id="bookmarkButtonPanel">
												<o:commandLink id="bookmarkButton" execute="bookmarkButton"
													render="bookmarkButtonPanel bookmarkList errorPanel"
													actionListener="#{BookmarkBean.setBookmark}">
													<f:param name="bookmarkName" value="userList" />

													<i title="#{fbresource['bookmarkToolTip']}"
														class="ficon bx #{BookmarkBean.getIcon('userList')} warning" />
												</o:commandLink>
											</h:panelGroup>
										</h:form></li>
									<li><a data-action="collapse"> <i
											class="bx bx-chevron-down" /></a></li>
									<li><a data-action="expand"> <i
											class="bx bx-fullscreen" /></a></li>
									<li><a data-action="reload"> <i class="bx bx-revision" /></a></li>
									<li><a data-action="close"> <i class="bx bx-x" /></a></li>
								</ul>
							</div>
						</div>
						<div class="card-content collapse show">
							<div class="card-body">
								<div class="row">
									<div class="col-sm-12">
										<div class="table-responsive">
											<h:form
												rendered="#{AdminUser.role eq 'Super User' || AdminUser.role eq 'Admin'}"
												id="UserFormConfirm">
												<h:panelGroup id="userConfirmInfo">
													<o:window rendered="#{UserTableBean.showPopUp eq true}"
														id="userConfirm" resizable="true" width="380px"
														height="200px" style="margin-left:300px;margin-top:100px;"
														styleClass="window"
														caption="#{fbresource['User_Confirm']}"
														captionStyle="background: #bbbbbb;
                            border-bottom: #e9e9e9 solid 1px;
                            position: relative;
                            padding: 0 0 0 6px;
                            color: white;"
														modal="true" modalLayerClass="modalLayer">

														<o:captionArea>
															<o:minimizeWindowButton
																minimizeImageUrl="/images/win_minimize.png"
																restoreImageUrl="./images/win_restore.jpg"
																styleClass="customButton" rolloverClass="buttonRollover" />
															<o:maximizeWindowButton
																maximizeImageUrl="/images/win_maximize.png"
																restoreImageUrl="images/win_restore.jpg"
																styleClass="customButton" rolloverClass="buttonRollover" />
															<o:closeWindowButton imageUrl="/images/win_close.png"
																styleClass="customButton" rolloverClass="buttonRollover" />
														</o:captionArea>
														<ui:include src="/xhtml/errorPanel.xhtml" />
														<center>
															<TABLE>
																<tr>
																	<td><label for="password">#{fbresource['Password']}<font
																			color="red">*</font></label></td>
																	<td><h:inputSecret
																			rendered="#{UserTableBean.showPopUp eq true}"
																			redisplay="true" immediate="true"
																			title="#{fbresource['Please_enter']} #{fbresource['Password']}"
																			value="#{UserTableBean.password}" size="31"
																			id="password" maxlength="15" required="true">
																		</h:inputSecret> <o:floatingIconMessage style="border-color: red;"
																			for="password" showDetail="true" showSummary="false" /></td>
																</tr>
																<tr>
																	<ui:include src="/xhtml/imageText.xhtml" />
																</tr>
																<tr>
																	<td><input type="button"
																		class="btn btn-primary glow"
																		onclick="O$('UserFormConfirm:userConfirm').hide();"
																		value="#{fbresource['Close']}"
																		title="#{fbresource['Please_click_here_to_close']}" /></td>
																	<td><o:commandButton
																			styleClass="btn btn-primary glow" value="Confirm"
																			id="forceDelete"
																			title="#{fbresource['Click_here_to']} #{fbresource['delete_user_with_all_the_Colleges_Users_Students_etc']}"
																			action="#{UserTableBean.forceDelete}">
																		</o:commandButton></td>
																</tr>
															</TABLE>
														</center>
													</o:window>
												</h:panelGroup>
											</h:form>
											<h:form
												rendered="#{AdminUser.role eq 'Super User' || AdminUser.role eq 'Admin'}"
												id="UserForm">
												<table cellSpacing="2" style="width: 1000px;">
													<tr>
														<td><h:outputText value="#{fbresource['User_Name']}" /></td>
														<td><h:inputText value="#{UserTableBean.userName}"
																id="UserCodeLookUpValue" columns="15" maximumLength="12">
															</h:inputText></td>
														<td><h:commandButton class="btn btn-primary glow"
																value="#{fbresource['search']}"
																style="margin-right:5px;"
																title="#{fbresource['Click_here_to']} #{fbresource['Search_Record']}"
																action="#{UserTableBean.searchRecord}" /> <o:commandButton
																style="margin-right:5px;"
																styleClass="btn btn-primary glow"
																value="#{fbresource['add']}" id="addUser"
																title="#{fbresource['Click_here_to']} #{fbresource['add']}"
																onajaxend="showNotice('userButton');"
																render="UserWindowForm"
																actionListener="#{UserTableBean.setUserToAdd}" /> <o:commandButton
																style="margin-right:5px;"
																styleClass="btn btn-primary glow"
																value="#{fbresource['update']}" id="update"
																title="#{fbresource['Click_here_to']} #{fbresource['update']}"
																onajaxend="showNotice('userButton');"
																execute="userListTable"
																render="UserWindowForm errorPanel"
																actionListener="#{UserTableBean.setUser}" /> <h:commandButton
																class="btn btn-primary glow" style="margin-right:5px;"
																value="#{fbresource['delete']}" id="deleteButtonAction"
																title="#{fbresource['Click_here_to']} #{fbresource['delete']}"
																action="#{UserTableBean.deleteSeletedRecord}">
																<o:confirmation id="buttonConfirmation"
																	message="#{fbresource['Are_you__sure_you_want_to_delete']}"
																	draggable="true" />
															</h:commandButton> <o:commandButton style="margin-right:5px;"
																styleClass="btn btn-primary glow"
																value="#{fbresource['Force_Delete']}"
																title="#{fbresource['Click_here_to']} #{fbresource['delete_user_with_all_the_Colleges_Users_Students_etc']}"
																type="button" actionListener="#{UserTableBean.setPopUP}"
																execute="paginationTableContainner"
																onajaxend="O$('UserFormConfirm:userConfirm').show();"
																render="UserFormConfirm" /> <h:commandButton
																class="btn btn-primary glow"
																value="#{fbresource['Change_Status']}" id="changeStatus"
																title="#{fbresource['Click_here_to']} #{fbresource['Change_Status']}"
																action="#{UserTableBean.changeStatus}">
																<o:confirmation id="changeStatusCOnfirm"
																	message="#{fbresource['Are_you__sure_you_want_to_change_the_status']}"
																	draggable="true" />
															</h:commandButton></td>
													</tr>
													<tr>
														<td></td>
														<td></td>
														<td><h:commandButton style="margin-right:5px;"
																class="btn btn-primary glow"
																value="#{fbresource['Login_As_Selected']}"
																id="asSelected"
																title="#{fbresource['Click_here_to']} #{fbresource['Login_As_Selected']}"
																action="#{UserTableBean.loginAsSelected}">
															</h:commandButton> <h:commandButton style="margin-right:5px;"
																class="btn btn-primary glow"
																value="#{fbresource['Reset_Password']}"
																id="resetButtonAction"
																title="#{fbresource['Click_here_to']} #{fbresource['Reset_Password']}"
																action="#{UserTableBean.resetPassword}">
																<o:confirmation id="resetPasswordConfirmation"
																	message="#{fbresource['Are_you__sure_you_want_to_Reset_Password']}"
																	draggable="true" />
															</h:commandButton> <h:commandButton class="btn btn-primary glow"
																style="margin-right:5px;"
																rendered="#{AdminMenu.enableEffortSystemFlag}"
																value="#{fbresource['Show_Efforts']}"
																id="showInfoButtonAction"
																title="#{fbresource['Click_here_to']} #{fbresource['Show_Efforts']}"
																action="#{UserTableBean.showInfo}">
															</h:commandButton> <input type="button" style="margin-right: 5px;"
															value="#{fbresource['Print']}"
															class="btn btn-primary glow"
															title="#{fbresource['Click_here_to']} #{fbresource['Print']}"
															onClick="window.print()" /> <h:commandButton
																title="#{fbresource['Generate']} #{fbresource['Excel_report']}"
																value="#{fbresource['Excel_report']}"
																image="/images/excel_button.png"
																style="height:30px;width:30px;" id="generateXls"
																action="#{UserTableBean.generateXls}" /> <h:commandButton
																title="#{fbresource['Generate']} #{fbresource['PDF_report']}"
																value="#{fbresource['PDF_report']}"
																image="/images/pdf_button.png"
																style="height:30px;width:30px;"
																action="#{UserTableBean.generatePdfReport}" /></td>

													</tr>
												</table>
												<h:panelGroup id="paginationTableContainner">
													<o:dataTable id="userListTable" var="loginDetails"
														value="#{UserTableBean.userList}" sortColumnId="userName"
														sortAscending="true"
														sortableHeaderRolloverStyle="background: #d4d4d4"
														style="width: 100%; line-height: 17px;"
														styleClass="datatable"
														rolloverRowStyle="background: #f1f1f1;">
														<o:multipleRowSelection
															rowDatas="#{UserTableBean.selectedUserList}"
															style="background: #a4aec5; color: white;" />
														<o:columnReordering />
														<f:facet name="columnMenu">
															<o:columnMenu />
														</f:facet>
														<o:column style="width: 2%;text-align: left;">
															<h:graphicImage styleClass="blinking"
																title="#{fbresource['Expired']}"
																rendered="#{loginDetails.className ne ''}"
																url="/images/red_expired.png" />
														</o:column>
														<o:selectionColumn style="width: 6%;" sortable="true"
															header="#{fbresource['Selection']}">
															<f:facet name="header">
																<o:selectAllCheckbox />
															</f:facet>
														</o:selectionColumn>

														<o:column header="#{fbresource['User_Name']}"
															sortingExpression="#{loginDetails.userName}">
															<o:commandLink
																actionListener="#{UserTableBean.setFileName}"
																onajaxend="document.getElementById('userFullIPicButton').click();"
																render="userFullIPic" id="userNameLink">
																<f:param name="userName" value="#{loginDetails.userName}" />
																	<h:outputText value="#{loginDetails.userName}" title="#{fbresource['Click_here_to']} #{fbresource['see_full_image_of']} #{loginDetails.userName}" />
															</o:commandLink>

														</o:column>


														<o:column header="#{fbresource['Role']}"
															sortingExpression="#{loginDetails.role}">
															<h:outputText rendered="#{loginDetails.role eq 'A'}"
																value="#{fbresource['Admin']}" />
															<h:outputText rendered="#{loginDetails.role eq 'S'}"
																value="#{fbresource['SuperUser']}" />
															<h:outputText rendered="#{loginDetails.role eq 'U'}"
																value="#{fbresource['User']}" />
															<h:outputText rendered="#{loginDetails.role eq 'C'}"
																value="#{fbresource['CollegeUser']}" />
															<h:outputText rendered="#{loginDetails.role eq 'N'}"
																value="#{fbresource['CompanyUser']}" />
														</o:column>
														<o:column header="#{fbresource['Status']}"
															sortingExpression="#{loginDetails.active}">
															<h:outputText rendered="#{loginDetails.active eq true}"
																value="#{fbresource['Active']}" />
															<h:outputText rendered="#{loginDetails.active eq false}"
																value="#{fbresource['InActive']}" />
														</o:column>
														<o:column header="#{fbresource['Last_Login']}"
															sortingExpression="#{loginDetails.lastLogin}">
															<h:outputText value="#{loginDetails.lastLogin}" />
														</o:column>
														<o:column header="#{fbresource['Valid_Till']}"
															style="text-align: center;color:red"
															sortingExpression="#{loginDetails.validTill}">
															<h:outputText styleClass="#{loginDetails.className}"
																value="#{loginDetails.validTill}">
																<f:convertDateTime pattern="dd/MM/yyyy" />
															</h:outputText>
														</o:column>
														<o:column header="#{fbresource['Address']}"
															sortingExpression="#{loginDetails.userdetails.address}">
															<o:hintLabel hintStyle="color:blue;font-size:15px;"
																hint="#{loginDetails.userdetails.address}"
																value="#{loginDetails.userdetails.address.length() gt 20 ? loginDetails.userdetails.address.substring(0,20).concat('...') : loginDetails.userdetails.address}" />
														</o:column>
														<o:column header="#{fbresource['Contact_Number']}"
															sortingExpression="#{loginDetails.userdetails.mobleNo}">
															<h:outputText value="#{loginDetails.userdetails.mobleNo}" />
														</o:column>
														<o:column header="#{fbresource['E_mail']}"
															sortingExpression="#{loginDetails.userdetails.email}">
															<o:hintLabel hintStyle="color:blue;font-size:15px;"
																hint="#{loginDetails.userdetails.email}"
																value="#{loginDetails.userdetails.email.length() gt 20 ? loginDetails.userdetails.email.substring(0,20).concat('...') : loginDetails.userdetails.email}" />
														</o:column>
														<f:event listener="#{UserTableBean.inIt}"
															type="preRenderView" />
													</o:dataTable>
													<table align="right">
														<tr>
															<td><ui:include src="/xhtml/pagination.xhtml" /></td>
														</tr>
													</table>
												</h:panelGroup>
											</h:form>
											<h:form
												rendered="#{AdminUser.role eq 'User' || AdminUser.role eq 'Compnay' || AdminUser.role eq 'College'}">
												<br />
												<br />
												<br />
												<br />
												<br />
												<center>
													<font color="red" size="7">
														#{fbresource['You_are_not_authorized_to_access_this_screen']}</font>
												</center>
											</h:form>
											<h:form id="fullImageForm">
												<button style="display: none" id="userFullIPicButton"
													type="button" data-toggle="modal"
													data-target="#userFullIPic" />
												<div class="modal fade text-left" id="userFullIPic"
													tabindex="-1" role="dialog"
													aria-labelledby="myModalLabel160" aria-hidden="true">
													<div
														class="modal-dialog modal-dialog-centered modal-dialog-scrollable"
														role="document">
														<div class="modal-content">
															<div class="modal-header bg-primary">
																<h5 class="modal-title white" id="myModalLabel160">#{fbresource['Large_Photo']}</h5>
																<button type="button" class="close" data-dismiss="modal"
																	aria-label="Close">
																	<i class="bx bx-x"></i>
																</button>
															</div>
															<div class="modal-body">
																<h:panelGroup id="userFullIPic">
																	<center>
																		<img src="#{parent.imageServiceUrl}/download/userprofilepics/#{UserTableBean.userName}.png" />
																		<br /> #{UserTableBean.userName} <br />
																	</center>
																</h:panelGroup>
															</div>
															<div class="modal-footer">
																<button type="button" class="btn btn-light-secondary"
																	data-dismiss="modal">
																	<i class="bx bx-x d-block d-sm-none"></i> <span
																		class="d-none d-sm-block">#{fbresource['Close']}</span>
																</button>
															</div>
														</div>
													</div>
												</div>
											</h:form>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</ui:define>
</ui:composition>
</html>
