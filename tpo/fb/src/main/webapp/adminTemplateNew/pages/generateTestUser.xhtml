<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="adminLayoutNew.xhtml">
	<ui:define name="content">
		<section id="card-actions">
			<!-- Info table about action starts -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">#{fbresource['generate_Test_Users']}</h4>
							<a class="heading-elements-toggle"> <i
								class='bx bx-dots-vertical font-medium-3' /></a>
							<div class="heading-elements">
								<ul class="list-inline mb-0">
									<li><h:form>
											<h:panelGroup id="bookmarkButtonPanel">
												<o:commandLink id="bookmarkButton" execute="bookmarkButton"
													render="bookmarkButtonPanel bookmarkList errorPanel"
													actionListener="#{BookmarkBean.setBookmark}">
													<f:param name="bookmarkName" value="generateTestUser" />
													
													<i title="#{fbresource['bookmarkToolTip']}"
														class="ficon bx #{BookmarkBean.getIcon('generateTestUser')} warning" />
												</o:commandLink>
											</h:panelGroup>
										</h:form></li>
									<li><a data-action="collapse"> <i
											class="bx bx-chevron-down" /></a></li>
									<li><a data-action="expand"> <i
											class="bx bx-fullscreen" /></a></li>
									<li><a data-action="reload"> <i class="bx bx-revision" /></a></li>
									<li><a data-action="close"> <i class="bx bx-x" /></a></li>
								</ul>
							</div>
						</div>
						<div class="card-content collapse show">
							<div class="card-body">
								<div class="row">
									<div class="col-sm-12">
										<div class="table-responsive">
											<h:form id="generateTestUserForm">
												<table cellPadding="1" align="center">
													<tr>
														<td>#{fbresource['prefixInEnrollmentNo']}</td>
														<td><h:inputText
																value="#{TestUsersRegistrationBean.prefixInENO}"
																title="#{fbresource['Please_enter']} #{fbresource['prefixInEnrollmentNo']}"
																size="10" id="prefixInEnrollmentNo" maxlength="9">
															</h:inputText></td>
														<td>#{fbresource['Password']}<font color="red">*</font></td>
														<td><h:inputSecret required="true" id="password"
																value="#{TestUsersRegistrationBean.password}"
																title="#{fbresource['Please_enter']} #{fbresource['password']}"
																size="10" maxlength="10">
															</h:inputSecret><input id="showPass" type="checkbox"
															onclick="showPassword('generateTestUserForm','password');"
															title="#{fbresource['showPassword']}" /></td>
													</tr>

													<tr>
														<td>#{fbresource['Start_Range']}<font color="red">*</font></td>
														<td><h:inputText required="true"
																value="#{TestUsersRegistrationBean.startRange}"
																title="#{fbresource['Please_enter']} #{fbresource['startRange']} #{fbresource['It_should_be_numeric']}"
																size="5" id="startRange" maxlength="5">
																<f:validateLength minimum="1" maximum="1000" />
															</h:inputText></td>
														<td>#{fbresource['End_Range']}<font color="red">*</font></td>
														<td><h:inputText required="true"
																value="#{TestUsersRegistrationBean.endRange}"
																title="#{fbresource['Please_enter']} #{fbresource['endRange']} #{fbresource['It_should_be_numeric']}"
																size="5" id="endRange" maxlength="5">
																<f:validateLength minimum="1" maximum="10000" />
															</h:inputText></td>
													</tr>
												</table>

												<table align="center" cellSpacing="15" width="150">
													<tr>
														<td><h:commandButton class="btn btn-primary glow"
																title="#{fbresource['Are_you__sure_you_want_to']} #{fbresource['Generate']}"
																id="saveRecord" value="#{fbresource['submit']}"
																action="#{TestUsersRegistrationBean.saveRecord}">
																<o:confirmation id="buttonConfirmation"
																	message="#{fbresource['Are_you__sure_you_want_to']} #{fbresource['Generate']}"
																	draggable="true" />
															</h:commandButton></td>
														<td><h:commandButton class="btn btn-primary glow"
																type="reset" value="#{fbresource['Reset']}" /></td>
													</tr>
												</table>
											</h:form>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
		<section id="card-actions">
			<!-- Info table about action starts -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">#{fbresource['delete_Test_Users']}</h4>
							<a class="heading-elements-toggle"> <i
								class='bx bx-dots-vertical font-medium-3' /></a>
							<div class="heading-elements">
								<ul class="list-inline mb-0">
											<li><a data-action="collapse"> <i
													class="bx bx-chevron-down" /></a></li>
											<li><a data-action="expand"> <i
													class="bx bx-fullscreen" /></a></li>
											<li><a data-action="reload"> <i
													class="bx bx-revision" /></a></li>
											<li><a data-action="close"> <i class="bx bx-x" /></a></li>
								</ul>
							</div>
						</div>
						<div class="card-content collapse show">
							<div class="card-body">
								<div class="row">
									<div class="col-sm-12">
										<div class="table-responsive">
											<h:form id="deleteTestUserForm">
												<table cellPadding="1" align="center">
													<tr>
														<td>#{fbresource['prefixInEnrollmentNo']}<font
															color="red">*</font></td>
														<td><h:inputText required="true"
																value="#{TestUsersRegistrationBean.deletePrefixEno}"
																title="#{fbresource['Please_enter']} #{fbresource['prefixInEnrollmentNo']}"
																size="10" id="deletePrefixEno" maxlength="20">
															</h:inputText></td>
													</tr>
												</table>

												<table align="center" cellSpacing="15" width="150">
													<tr>
														<td><h:commandButton class="btn btn-primary glow"
																title="#{fbresource['Are_you__sure_you_want_to']} #{fbresource['delete']}"
																id="deleteRecords" value="#{fbresource['submit']}"
																action="#{TestUsersRegistrationBean.deleteRecords}">
																<o:confirmation id="buttonConfirmation"
																	message="#{fbresource['Are_you__sure_you_want_to']} #{fbresource['delete']}"
																	draggable="true" />
															</h:commandButton></td>
														<td><h:commandButton class="btn btn-primary glow"
																type="reset" value="#{fbresource['Reset']}" /></td>
													</tr>
												</table>
											</h:form>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</ui:define>
</ui:composition>
</html>
