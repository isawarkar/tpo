<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="adminLayoutNew.xhtml">
	<ui:define name="content">
		<section id="card-actions">
			<!-- Info table about action starts -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">#{fbresource['Review']}</h4>
							<a class="heading-elements-toggle"> <i
								class='bx bx-dots-vertical font-medium-3' /></a>
							<div class="heading-elements">
								<ul class="list-inline mb-0">
									<li><h:form>
											<h:panelGroup id="bookmarkButtonPanel">
												<o:commandLink id="bookmarkButton" execute="bookmarkButton"
													render="bookmarkButtonPanel bookmarkList errorPanel"
													actionListener="#{BookmarkBean.setBookmark}">
													<f:param name="bookmarkName" value="review" />
													
													<i title="#{fbresource['bookmarkToolTip']}"
														class="ficon bx #{BookmarkBean.getIcon('review')} warning" />
												</o:commandLink>
											</h:panelGroup>
										</h:form></li>
									<li><a data-action="collapse"> <i
											class="bx bx-chevron-down" /></a></li>
									<li><a data-action="expand"> <i
											class="bx bx-fullscreen" /></a></li>
									<li><a data-action="reload"> <i class="bx bx-revision" /></a></li>
									<li><a data-action="close"> <i class="bx bx-x" /></a></li>
								</ul>
							</div>
						</div>
						<div class="card-content collapse show">
							<div class="card-body">
								<div class="row">
									<div class="col-sm-12">
										<div class="table-responsive">
											<h:form id="review">
												<h:panelGroup id="reviewPanel">
													<table>
														<tr>
															<td><h:outputLabel
																	value="#{fbresource['Review_Comment']}" /></td>
														</tr>
														<tr>
															<td><h:inputTextarea maxLeght="5000" id="comment"
																	value="#{CustomerReviewBean.comment}" required="true"
																	requiredMessage="#{fbresource['Please_enter']} #{fbresource['Review_Comment']}"
																	cols="100" rows="10" /> <o:floatingIconMessage
																	style="border-color: red;" for="comment"
																	showDetail="true" showSummary="false" /></td>
														</tr>
														<tr>
															<td><h:selectOneMenu immediate="true"
																	value="#{CustomerReviewBean.starRating}" id="rating"
																	required="true">
																	<f:selectItem itemValue="0" itemLabel="Zero Star" />
																	<f:selectItem itemValue="1" itemLabel="One Star" />
																	<f:selectItem itemValue="2" itemLabel="Two Star" />
																	<f:selectItem itemValue="3" itemLabel="Three Star" />
																	<f:selectItem itemValue="4" itemLabel="Four Star" />
																	<f:selectItem itemValue="5" itemLabel="Five Star" />
																</h:selectOneMenu></td>
														</tr>
														<tr>
															<td><o:commandButton
																	styleClass="btn btn-primary glow" id="login"
																	render="reviewPanel errorPanel" execute="reviewPanel"
																	title="#{fbresource['Click_here_to']} #{fbresource['Submit_the_Review']}"
																	action="#{CustomerReviewBean.addReview}"
																	value="#{fbresource['Submit_the_Review']}" /></td>
														</tr>
													</table>
												</h:panelGroup>
											</h:form>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</ui:define>
</ui:composition>
</html>
