<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<o:popupMenu>
	<o:menuItem iconUrl="/images/icons/save-16x16.png"
		value="#{fbresource['Add_To_Company']}">
		<o:ajax id="Add" listener="#{RegistrationTableBean.setCompanyList}"
			onajaxend="document.getElementById('addToCompanyButton').click();"
			render="addToCompanyPanel" />
	</o:menuItem>
	<o:menuItem iconUrl="/images/icons/cut-16x16.png"
		value="#{fbresource['Delete_from_Company']}">
		<o:ajax id="Delete" listener="#{RegistrationTableBean.setCompanyList}"
			onajaxend="document.getElementById('addToCompanyButton').click();"
			render="addToCompanyPanel" />
	</o:menuItem>
	<o:menuSeparator />
	<o:menuItem iconUrl="/images/icons/save-16x16.png"
		value="#{fbresource['Add_to_Black_List']}"
		action="#{RegistrationTableBean.addToBlackList}" />
	<o:menuItem iconUrl="/images/icons/cut-16x16.png"
		value="#{fbresource['Delete_from_Black_List']}"
		action="#{RegistrationTableBean.removeFromBlackList}" />
	<o:menuSeparator />
	<o:menuItem iconUrl="/images/icons/save-16x16.png" value="#{fbresource['Approve']}"
		action="#{RegistrationTableBean.approve}" />
	<o:menuItem iconUrl="/images/icons/cut-16x16.png" value="#{fbresource['Dis_Approve']}"
		action="#{RegistrationTableBean.pending}" />
	<o:menuSeparator />
	<o:menuItem iconUrl="/images/icons/save-16x16.png" value="#{fbresource['block']}"
		action="#{RegistrationTableBean.block(false)}" />
	<o:menuItem iconUrl="/images/icons/cut-16x16.png" value="#{fbresource['unblock']}"
		action="#{RegistrationTableBean.block(true)}" />
		
	<o:menuItem iconUrl="/images/chart.jpg" value="#{fbresource['Result_Analysis']}" id="resultAnalysis">
	<o:ajax id="setResult" listener="#{RegistrationTableBean.setResult}"
			onajaxend="document.getElementById('resultAnalysisButton').click();"
			render="ChartWindowForm errorPanel" execute="StudentForm"/>
			</o:menuItem>
	<o:menuSeparator />
</o:popupMenu>
</html>
