<html xmlns="http://www.w3.org/1999/xhtml"

<ui:composition template="adminLayoutNew.xhtml">
	<ui:define name="content">
		<section id="card-actions">
			<!-- Info table about action starts -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">
								<h:outputText
									rendered="#{StudentRegistrationBean.currentMode eq 'Update'}"
									value="#{fbresource['Last_Updated_on']} #{StudentRegistrationBean.percentageinfo.lastUpdated} #{fbresource['By']} #{StudentRegistrationBean.percentageinfo.lastUpdatedBy}"></h:outputText>
							</h4>
							<a class="heading-elements-toggle"> <i
								class='bx bx-dots-vertical font-medium-3'></i>
							</a>
							<div class="heading-elements">
								<ul class="list-inline mb-0">
								<li><a data-action="collapse"> <i
											class="bx bx-chevron-down"></i>
									</a></li>
									<li><a data-action="expand"> <i
											class="bx bx-fullscreen"></i>
									</a></li>
									<li><a data-action="reload"> <i class="bx bx-revision"></i>
									</a></li>
									<li><a data-action="close"> <i class="bx bx-x"></i>
									</a></li>
								</ul>
							</div>
						</div>
						<div class="card-content collapse show">

															</label></td>
															<td><h:inputText id="PGPercent" immediate="true"
																	requiredMessage="Please enter #{fbresource['Post_Graduation_percent']}"
																	required="#{StudentRegistrationBean.currentCourse eq 'Post Graduation'}"
																	size="3" maxlength="5"
																	value="#{StudentRegistrationBean.percentageinfo.meAverage}">
																	<f:validator validatorId="PercentValidator" />
																	<f:ajax render="@this" />
																</h:inputText></td>
														</h:panelGroup>
														<h:panelGroup
															rendered="#{StudentRegistrationBean.currentCourse eq 'Diploma'}">
															<td><label for="diplomaOthers">
																	<p>#{fbresource['Diploma_percent']}</p>
															</label></td>
															<td><h:inputText id="diplomaPercent"
																	requiredMessage="Please enter #{fbresource['Diploma_percent']}"
																	required="true" size="3" maxlength="5"
																	value="#{StudentRegistrationBean.percentageinfo.diplomaOthers}">

																	<f:ajax render="@this" />
																</h:inputText></td>
														</h:panelGroup>

															<td><label for="beAverege">
																	<p>
																		#{fbresource['Graduation_percent']}

																			rendered="#{StudentRegistrationBean.currentCourse eq 'Post Graduation'}">
																			<font color="red">*</font>
																		</f:verbatim>
																	</p>
															</label></td>
															<td><h:inputText immediate="true" id="beAverege"
																	requiredMessage="Please enter Graduation(%)"
																	required="#{StudentRegistrationBean.currentCourse eq 'Post Graduation'}"

																	value="#{StudentRegistrationBean.percentageinfo.beAverege}" />

																	for="beAverege" showDetail="true" showSummary="false" /></td>

															<td><label for="diplomaOthers">
																	<p>
																		#{fbresource['Diploma_percent']}
																		<f:verbatim
																			rendered="#{StudentRegistrationBean.personalinfo.diploma ne ''}">
																			<font color="red">*</font>
																		</f:verbatim>
																	</p>
															</label></td>
															<td><h:inputText id="diplomaOthers" immediate="true"
																	requiredMessage="Please enter Diploma(%)"
																	required="#{StudentRegistrationBean.personalinfo.diploma ne ''}"
																	size="3" maxlength="5"

																for="highSchoolPercent" showDetail="true"
																showSummary="false" /></td>

																</p>

																showSummary="false" /></td>
