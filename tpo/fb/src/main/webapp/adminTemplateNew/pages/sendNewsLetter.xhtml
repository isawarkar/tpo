<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="adminLayoutNew.xhtml">
	<ui:define name="content">
		<ui:include src="attachments.xhtml" />

		<section id="card-actions">
			<!-- Info table about action starts -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">#{fbresource['News_Letter']}</h4>
							<a class="heading-elements-toggle"> <i
								class='bx bx-dots-vertical font-medium-3' /></a>
							<div class="heading-elements">
								<ul class="list-inline mb-0">
									<li><h:form>
											<h:panelGroup id="bookmarkButtonPanel">
												<o:commandLink id="bookmarkButton" execute="bookmarkButton"
													render="bookmarkButtonPanel bookmarkList errorPanel"
													actionListener="#{BookmarkBean.setBookmark}">
													<f:param name="bookmarkName" value="sendNewsLetter" />
													
													<i title="#{fbresource['bookmarkToolTip']}"
														class="ficon bx #{BookmarkBean.getIcon('sendNewsLetter')} warning" />
												</o:commandLink>
											</h:panelGroup>
										</h:form></li>
									<li><a data-action="collapse"> <i
											class="bx bx-chevron-down" /></a></li>
									<li><a data-action="expand"> <i
											class="bx bx-fullscreen" /></a></li>
									<li><a data-action="reload"> <i class="bx bx-revision" /></a></li>
									<li><a data-action="close"> <i class="bx bx-x" /></a></li>
								</ul>
							</div>
						</div>
						<div class="card-content collapse show">
							<div class="card-body">
								<div class="row">
									<div class="col-sm-12">
										<div class="table-responsive">
											<h:form id="NewsLetter" enctype="multipart/form-data">
												<table>
													<tr>
														<td>#{fbresource['Message']}<font color="red">*</font></td>
														<td colspan="3"><h:inputTextarea required="true"
																value="#{NewsLetterBean.message}" id="newsLetterMessage"
																width="400" height="270" /></td>
													</tr>
													<tr>
														<td>#{fbresource['selectAttachment']}</td>
														<td><h:commandButton type="button"
																title="#{fbresource['selectAttachment']}"
																image="/images/attachment-solid.png"
																onclick="O$('AttachmentFormWindow').show();"
																style="height:25x;width:25px;" /></td>
													</tr>
													<o:forEach items="#{EmailAttachmentBean.fileList}"
														var="file">
														<tr>
															<td></td>
															<td>#{file}</td>
														</tr>
													</o:forEach>
												</table>

												<table align="center" cellSpacing="15" width="150">
													<tr>
														<td><h:commandButton class="btn btn-primary glow"
																title="#{fbresource['Click_here_to_Send_Message']}"
																id="shortAllRecord"
																value="#{fbresource['Send_Message']}"
																action="#{NewsLetterBean.sendMessage}">
																<o:confirmation id="buttonConfirmation"
																	message="#{fbresource['It_can_take_time_to_send_message_for_large_numbers_of_Students']}"
																	draggable="true" />
															</h:commandButton></td>
														<td><h:commandButton class="btn btn-primary glow"
																type="reset" value="#{fbresource['Reset']}" /></td>
													</tr>
												</table>
												<script>
													CKEDITOR
															.replace('NewsLetter:newsLetterMessage');
												</script>
											</h:form>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</ui:define>
</ui:composition>
</html>
