<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="adminLayoutNew.xhtml">
	<ui:define name="content">
		<h:form id="ComplaintEditForm">
			<o:window rendered="#{ComplaintTableBean.complaint ne null}"
				id="ComplaintEditWindow" resizable="true" width="1050px"
				height="450px" styleClass="window"
				caption="#{fbresource['New_Message_Notice']}"
				captionStyle="background: #bbbbbb;
                            border-bottom: #e9e9e9 solid 1px;
                            position: relative;
                            padding: 0 0 0 6px;
                            color: white;"
				modal="true" modalLayerClass="modalLayer">
				<o:captionArea>
					<o:minimizeWindowButton minimizeImageUrl="/images/win_minimize.png"
						restoreImageUrl="./images/win_restore.jpg"
						styleClass="customButton" rolloverClass="buttonRollover" />
					<o:maximizeWindowButton maximizeImageUrl="/images/win_maximize.png"
						restoreImageUrl="images/win_restore.jpg" styleClass="customButton"
						rolloverClass="buttonRollover" />
					<o:closeWindowButton imageUrl="/images/win_close.png"
						styleClass="customButton" rolloverClass="buttonRollover" />
				</o:captionArea>
				<ui:include src="/xhtml/errorPanel.xhtml" />
				<h:panelGroup id="NoticePanel">
					<fieldset>
						<legend>#{fbresource['Complaint']}
							#{fbresource['ADD_OR_UPDATE']}</legend>
						<table align="center" styleClass="registration_table"
							cellPadding="2">
							<tr>
								<td><h:inputTextarea
										rendered="#{ComplaintTableBean.complaint ne null}"
										style="margin-top:50px;" id="complaint" rows="10" cols="50"
										value="#{ComplaintTableBean.complaint.complaint}"
										maxlength="1000">
									</h:inputTextarea></td>
							</tr>
						</table>
						<table halign="left">
							<tr>
								<td><o:commandButton styleClass="btn btn-primary glow"
										value="#{fbresource['update']}"
										title="#{fbresource['Please_click_here_save_data']}"
										action="#{ComplaintTableBean.updateComplaint}" /></td>
								<td><o:commandButton styleClass="btn btn-primary glow"
										value="#{fbresource['updateAndClose']}"
										title="#{fbresource['Please_click_here_save_data']}"
										action="#{ComplaintTableBean.updateAndCloseComplaint}" /></td>
							</tr>
						</table>
					</fieldset>
					<script>
						CKEDITOR.replace('ComplaintEditForm:complaint');
					</script>
				</h:panelGroup>
			</o:window>
		</h:form>
		<section id="card-actions">
			<!-- Info table about action starts -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">#{fbresource['Complaint_List']}</h4>
							<a class="heading-elements-toggle"> <i
								class='bx bx-dots-vertical font-medium-3' /></a>
							<div class="heading-elements">
								<ul class="list-inline mb-0">
									<li><h:form>
											<h:panelGroup id="bookmarkButtonPanel">
												<o:commandLink id="bookmarkButton" execute="bookmarkButton"
													render="bookmarkButtonPanel bookmarkList errorPanel"
													actionListener="#{BookmarkBean.setBookmark}">
													<f:param name="bookmarkName" value="complaintList" />
													
													<i title="#{fbresource['bookmarkToolTip']}"
														class="ficon bx #{BookmarkBean.getIcon('complaintList')} warning" />
												</o:commandLink>
											</h:panelGroup>
										</h:form></li>
									<li><a data-action="collapse"> <i
											class="bx bx-chevron-down" /></a></li>
									<li><a data-action="expand"> <i
											class="bx bx-fullscreen" /></a></li>
									<li><a data-action="reload"> <i class="bx bx-revision" /></a></li>
									<li><a data-action="close"> <i class="bx bx-x" /></a></li>
								</ul>
							</div>
						</div>
						<div class="card-content collapse show">
							<div class="card-body">
								<div class="row">
									<div class="col-sm-12">
										<div class="table-responsive">
											<h:form id="ComplaintForm">
												<table cellSpacing="5">
													<tr>
														<td><h:outputText
																value="#{fbresource['Complaint_Number']}" /></td>
														<td><h:inputText
																value="#{ComplaintTableBean.complaintNumber}"
																id="noticeName" /></td>
														<td>#{fbresource['Status']}</td>
														<td><h:selectOneMenu
																value="#{ComplaintTableBean.status}">
																<f:selectItem itemLabel="" itemValue="" />
																<f:selectItem itemLabel="#{fbresource['Open']}"
																	itemValue="false" />
																<f:selectItem itemLabel="#{fbresource['Closed']}"
																	itemValue="true" />
															</h:selectOneMenu></td>
														<td><h:commandButton class="btn btn-primary glow"
																value="#{fbresource['search']}"
																title="#{fbresource['Click_here_to']} #{fbresource['Search_Record']}"
																action="#{ComplaintTableBean.searchRecord}" /></td>
														<td><o:commandButton
																styleClass="btn btn-primary glow"
																value="#{fbresource['View']}" id="View"
																title="#{fbresource['Click_here_to']} #{fbresource['View']}"
																onajaxend="document.getElementById('viewComplaintButton').click();"
																execute="complaintListTable"
																render="viewComplaintForm errorPanel"
																actionListener="#{ComplaintTableBean.setComplaint}" /></td>
														<td><o:commandButton
																styleClass="btn btn-primary glow"
																value="#{fbresource['Edit']}" id="Edit"
																title="#{fbresource['Click_here_to']} #{fbresource['Edit']}"
																onajaxend="if(O$('ComplaintEditForm:ComplaintEditWindow') != null){O$('ComplaintEditForm:ComplaintEditWindow').show();}"
																execute="complaintListTable"
																render="ComplaintEditForm errorPanel"
																actionListener="#{ComplaintTableBean.setComplaintToUpdate}" /></td>
														<td><h:commandButton class="btn btn-primary glow"
																value="#{fbresource['delete']}" id="deleteButtonAction"
																title="#{fbresource['Click_here_to']} #{fbresource['delete']}"
																action="#{ComplaintTableBean.deleteSeletedRecord}">
																<o:confirmation id="buttonConfirmation"
																	message="#{fbresource['Are_you__sure_you_want_to_delete']}"
																	draggable="true" />
															</h:commandButton></td>
														<td><h:commandButton class="btn btn-primary glow"
																value="#{fbresource['Change_Status']}" id="changeStatus"
																title="#{fbresource['Click_here_to']} #{fbresource['Change_Status']}"
																action="#{ComplaintTableBean.changeStatus}">
																<o:confirmation id="changeStatusConfirm"
																	message="#{fbresource['Are_you__sure_you_want_to_Change_Status']}"
																	draggable="true" />
															</h:commandButton></td>
														<td><input type="button"
															value="#{fbresource['Print']}"
															class="btn btn-primary glow"
															title="#{fbresource['Click_here_to']} #{fbresource['Print']}"
															onClick="window.print()" /></td>
														<td><h:commandButton
																title="#{fbresource['Generate']} #{fbresource['Excel_report']}"
																value="#{fbresource['Excel_report']}"
																image="/images/excel_button.png"
																style="height:40px;width:40px;" id="generateXls"
																action="#{ComplaintTableBean.generateXls}" /></td>
														<td><h:commandButton
																title="#{fbresource['Generate']} #{fbresource['PDF_report']}"
																value="#{fbresource['PDF_report']}"
																image="/images/pdf_button.png"
																style="height:40px;width:40px;"
																action="#{ComplaintTableBean.generatePdfReport}" /></td>
													</tr>
												</table>
												<h:panelGroup id="paginationTableContainner">
													<o:dataTable id="complaintListTable" var="complaint"
														value="#{ComplaintTableBean.complaintList}"
														sortColumnId="complaintNumber" sortAscending="true"
														sortableHeaderRolloverStyle="background: #d4d4d4"
														style="width: 100%; line-height: 17px;"
														styleClass="datatable"
														rolloverRowStyle="background: #f1f1f1;">
														<o:multipleRowSelection
															rowDatas="#{ComplaintTableBean.selectedComplaintList}"
															style="background: #a4aec5; color: white;" />
														<o:columnReordering />
														<f:facet name="columnMenu">
															<o:columnMenu />
														</f:facet>
														<o:selectionColumn style="width: 6%;" sortable="true"
															header="#{fbresource['Selection']}">
															<f:facet name="header">
																<o:selectAllCheckbox />
															</f:facet>
														</o:selectionColumn>
														<o:column header="#{fbresource['Complaint_Number']}"
															id="complaintNumber"
															sortingExpression="#{complaint.complaintNumber}"
															style="text-align: left;">
															<h:outputText value="#{complaint.complaintNumber}" />
														</o:column>
														<o:column header="#{fbresource['name']}"
															sortingExpression="#{complaint.name}"
															style="text-align: center;">
															<h:outputText value="#{complaint.name}" />
														</o:column>
														<o:column header="#{fbresource['E_mail']}"
															sortingExpression="#{complaint.email}"
															style="text-align: center;">
															<h:outputText value="#{complaint.email}" />
														</o:column>
														<o:column header="#{fbresource['Contact_Number']}"
															sortingExpression="#{complaint.contactNumber}"
															style="text-align: center;">
															<h:outputText value="#{complaint.contactNumber}" />
														</o:column>
														<o:column header="#{fbresource['Creation_date']}"
															sortingExpression="#{complaint.createdOn}"
															style="text-align: center;">
															<h:outputText value="#{complaint.createdOn}">
																<f:convertDateTime pattern="dd/MM/yyyy hh:mm a" />
															</h:outputText>
														</o:column>

														<o:column header="#{fbresource['Updated_date']}"
															sortingExpression="#{complaint.updatedOn}"
															style="text-align: center;">
															<h:outputText value="#{complaint.updatedOn}">
																<f:convertDateTime pattern="dd/MM/yyyy hh:mm a" />
															</h:outputText>
														</o:column>

														<o:column header="#{fbresource['Status']}"
															sortingExpression="#{complaint.status}"
															style="text-align: center;">
															<h:outputText rendered="#{complaint.status eq true}"
																style="color: green;" value="#{fbresource['Closed']}" />
															<h:outputText rendered="#{complaint.status eq false}"
																style="color: red;" value="#{fbresource['Open']}" />
														</o:column>
														<f:event listener="#{ComplaintTableBean.inIt}"
															type="preRenderView" />
													</o:dataTable>
													<table align="right">
														<tr>
															<td><ui:include src="/xhtml/pagination.xhtml" /></td>
														</tr>
													</table>
												</h:panelGroup>
											</h:form>
											<button style="display: none" id="viewComplaintButton"
												type="button" data-toggle="modal"
												data-target="#viewComplaint" />
											<h:form id="viewComplaintForm">
												<div class="modal fade text-left w-100" id="viewComplaint"
													tabindex="-1" role="dialog"
													aria-labelledby="myModalLabel20" aria-hidden="true">
													<div
														class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-full"
														role="document">
														<div class="modal-content">
															<div class="modal-header bg-primary">
																<h5 class="modal-title white" id="myModalLabel160">#{fbresource['Complaint']}</h5>
																<button type="button" class="close" data-dismiss="modal"
																	aria-label="Close">
																	<i class="bx bx-x"></i>
																</button>
															</div>
															<div class="modal-body">
																<h:outputText
																	rendered="#{ComplaintTableBean.complaint ne null}"
																	value="#{ComplaintTableBean.complaint.complaint}"
																	escape="false" />
															</div>
															<div class="modal-footer">
																<button type="button" class="btn btn-light-secondary"
																	data-dismiss="modal">
																	<i class="bx bx-x d-block d-sm-none"></i> <span
																		class="d-none d-sm-block">#{fbresource['Close']}</span>
																</button>
															</div>
														</div>
													</div>
												</div>
											</h:form>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</ui:define>
</ui:composition>
</html>
