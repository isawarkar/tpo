<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="adminLayoutNew.xhtml">
	<ui:define name="content">
		<ui:include src="/xhtml/collegeLookUp.xhtml" />
		<ui:include src="attachments.xhtml" />

		<section id="card-actions">
			<!-- Info table about action starts -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">
								<h:outputText
									rendered="#{CreateOpeninngBean.createOpeninngBool eq true}"
									value="#{fbresource['Create_Openings']}" />
								<h:outputText
									rendered="#{CreateOpeninngBean.createOpeninngBool eq false}"
									value="#{fbresource['Short_Records']}" />
							</h4>
							<a class="heading-elements-toggle"> <i
								class='bx bx-dots-vertical font-medium-3' /></a>
							<div class="heading-elements">
								<ul class="list-inline mb-0">
									<li><h:form>
											<h:panelGroup id="bookmarkButtonPanel">
												<o:commandLink rendered="#{CreateOpeninngBean.createOpeninngBool eq false}"
												    id="bookmarkButton" execute="bookmarkButton"
													render="bookmarkButtonPanel bookmarkList errorPanel"
													actionListener="#{BookmarkBean.setBookmark}">
													<f:param name="bookmarkName" value="shortRecord" />
													
													<i title="#{fbresource['bookmarkToolTip']}"
														class="ficon bx #{BookmarkBean.getIcon('shortRecord')} warning" />
												</o:commandLink>
											</h:panelGroup>
											<h:panelGroup id="bookmarkButtonPanel1">
												<o:commandLink rendered="#{CreateOpeninngBean.createOpeninngBool eq true}"
												    id="bookmarkButton1" execute="bookmarkButton1"
													render="bookmarkButtonPanel1 bookmarkList errorPanel"
													actionListener="#{BookmarkBean.setBookmark}">
													<f:param name="bookmarkName" value="createOpeninng" />
													
													<i title="#{fbresource['bookmarkToolTip']}"
														class="ficon bx #{BookmarkBean.getIcon('createOpeninng')} warning" />
												</o:commandLink>
											</h:panelGroup>
										</h:form></li>
									<li><a data-action="collapse"> <i
											class="bx bx-chevron-down" /></a></li>
									<li><a data-action="expand"> <i
											class="bx bx-fullscreen" /></a></li>
									<li><a data-action="reload"> <i class="bx bx-revision" /></a></li>
									<li><a data-action="close"> <i class="bx bx-x" /></a></li>
								</ul>
							</div>
						</div>
						<div class="card-content collapse show">
							<div class="card-body">
								<div class="row">
									<div class="col-sm-12">
										<div class="table-responsive">
											<h:form id="ShortForm">
												<h:panelGroup
													rendered="#{CreateOpeninngBean.xlsFileName ne null and CreateOpeninngBean.openingXls}">
													<table align="center">
														<tr>
															<td><h:graphicImage url="/images/xls-icon.gif"
																	title="#{fbresource['Excel_Report']}" /></td>
															<td><h:commandLink
																	value="#{CreateOpeninngBean.xlsFileName}" id="fileName"
																	title="#{fbresource['Please_click_here_to_download_file']}"
																	style="font-family: arial, helvetica, verdana, sans-serif;color: blue;font-size: 20px;"
																	action="#{CreateOpeninngBean.renderFile}" /></td>
														</tr>
													</table>
												</h:panelGroup>
												<table cellPadding="1" align="center">
													<h:panelGroup
														rendered="#{CreateOpeninngBean.createOpeninngBool}">
														<ui:include src="createOpening.xhtml" />
													</h:panelGroup>
													<ui:include src="commonShort.xhtml" />
													<tr>
														<td>#{fbresource['Branch_List']}</td>
														<td colspan="3"><o:twoListSelection
																style="width: 100%;"
																leftListboxHeader="#{fbresource['Available_Branch']}"
																rightListboxHeader="#{fbresource['Applied_Branch']}"
																value="#{ShortRecord.selectedBranchList}"
																reorderingAllowed="false" sortingAllowed="false">
																<c:forEach items="#{ShortRecord.branchList}"
																	var="branch">
																	<f:selectItem itemLabel="#{branch}"
																		itemValue="#{branch}" />
																</c:forEach>

															</o:twoListSelection></td>
													</tr>
													<tr>
														<td>#{fbresource['Company_List']}<f:verbatim
																rendered="#{CreateOpeninngBean.createOpeninngBool}">
																<font color="red">*</font>
															</f:verbatim></td>
														<td colspan="3"><o:twoListSelection
																required="#{CreateOpeninngBean.createOpeninngBool}"
																style="width: 100%;"
																leftListboxHeader="#{fbresource['Available_Company']}"
																rightListboxHeader="#{fbresource['Applied_Company']}"
																value="#{ShortRecord.selectedCompanyList}"
																reorderingAllowed="false" sortingAllowed="false">
																<c:forEach items="#{ShortRecord.companyList}"
																	var="company">
																	<f:selectItem itemLabel="#{company}"
																		itemValue="#{company}" />
																</c:forEach>
															</o:twoListSelection></td>
													</tr>
													<tr>
														<td>#{fbresource['Email_From_List']}</td>
														<td colspan="3"><o:twoListSelection
																style="width: 100%;"
																leftListboxHeader="#{fbresource['Available_E_mails']}"
																id="fromEmail"
																rightListboxHeader="#{fbresource['Applied_E_mails']}"
																required="#{param['ShortForm:emailNoti'] eq 'on' || param['ShortForm:sendXLSFile'] eq 'on'}"
																value="#{ShortRecord.selectedAdminFromList}"
																reorderingAllowed="false" sortingAllowed="false">
																<c:forEach items="#{ShortRecord.adminFromList}"
																	var="fromEmail">
																	<f:selectItem itemLabel="#{fromEmail}"
																		itemValue="#{fromEmail}" />
																</c:forEach>
															</o:twoListSelection></td>
													</tr>
													<tr>
														<td>#{fbresource['E_mail_To_List']}</td>
														<td colspan="3"><o:twoListSelection
																style="width: 100%;"
																leftListboxHeader="#{fbresource['Available_E_mails']}"
																id="toEmail"
																rightListboxHeader="#{fbresource['Applied_E_mails']}"
																required="#{param['ShortForm:emailNoti'] eq 'on' || param['ShortForm:sendXLSFile'] eq 'on'}"
																value="#{ShortRecord.selectedAdminToList}"
																reorderingAllowed="false" sortingAllowed="false">
																<c:forEach items="#{ShortRecord.adminToList}"
																	var="toEmail">
																	<f:selectItem itemLabel="#{toEmail}"
																		itemValue="#{toEmail}" />
																</c:forEach>
															</o:twoListSelection></td>
													</tr>
												</table>
												<table align="center">
													<tr>
														<td><h:outputText styleClass="excelText"
																value="#{fbresource['Allow_selected_students']}" /></td>
														<td><h:selectBooleanCheckbox
																title="#{fbresource['Please_select_this_check_If_you_want_to_Allow_selected_students']}"
																value="#{ShortRecord.allowSelected}" /></td>
													</tr>
													<tr>
														<td><h:outputText styleClass="excelText"
																value="#{fbresource['If_you_want_to_generate_excel_report_Please_select_check_box']}" />
														</td>
														<td><h:selectBooleanCheckbox
																title="#{fbresource['Please_select_this_check_If_you_want_to_generate_excel_report']}"
																value="#{ShortRecord.excelReport}" /></td>
													</tr>
													<tr>
														<td><h:outputText styleClass="excelText"
																value="#{fbresource['Send_generated_Excel_file_on_E_mails']}" /></td>
														<td><h:selectBooleanCheckbox id="sendXLSFile"
																title="#{fbresource['Please_select_this_check_If_you_want_send_xls_file_on_E_mails']}"
																value="#{ShortRecord.excelReportEmail}">
																<o:ajax event="change" execute="sendXLSFile"
																	render="fromEmail toEmail" />
															</h:selectBooleanCheckbox></td>
													</tr>
													<tr>
														<td><h:outputText styleClass="excelText"
																value="#{fbresource['Send_E_mail_notification_to_all_the_shorted_Students_Please_select_check_box']}" />
														</td>
														<td><h:selectBooleanCheckbox id="emailNoti"
																title="#{fbresource['Please_select_this_check_If_you_want_Send_E_mail_notification_to_all_the_Students']}"
																value="#{ShortRecord.emailNotification}">
																<o:ajax event="change" execute="emailNoti"
																	listener="#{EmailAttachmentBean.clearAjax}"
																	render="fromEmail toEmail attachmnetPanel" />
															</h:selectBooleanCheckbox></td>
													</tr>
												</table>
												<h:panelGroup id="attachmnetPanel">
													<table style="margin-left: 250px;">
														<tr>
															<td><h:commandButton type="button"
																	rendered="#{param['ShortForm:emailNoti'] eq 'on'}"
																	title="#{fbresource['selectAttachment']}"
																	image="/images/attachment-solid.png"
																	onclick="O$('AttachmentFormWindow').show();"
																	style="height:25x;width:25px;" /></td>
														</tr>
														<o:forEach items="#{EmailAttachmentBean.fileList}"
															var="file">
															<tr>
																<td>#{file}</td>
															</tr>
														</o:forEach>
													</table>
												</h:panelGroup>
												<table align="center" cellSpacing="15" width="150">
													<tr>
														<td><h:commandButton class="btn btn-primary glow"
																title="#{fbresource['Click_here_to_Short_Records']}"
																id="shortAllRecord" value="#{fbresource['submit']}"
																action="#{ShortRecord.shortAllRecord}" /></td>
														<td><h:commandButton class="btn btn-primary glow"
																type="reset" value="#{fbresource['Reset']}" /></td>
													</tr>
												</table>
											</h:form>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</ui:define>
	<script type="text/javascript">
		 O$('AttachmentFormWindow').hide();
		</script>
</ui:composition>
</html>
