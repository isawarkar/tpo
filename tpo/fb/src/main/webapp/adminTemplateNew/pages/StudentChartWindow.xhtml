<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">

<h:form id="ChartWindowForm">
	<button style="display: none" id="resultAnalysisButton" type="button"
		data-toggle="modal" data-target="#resultAnalysis" />
	<!--Notice Message start -->
	<div class="modal fade text-left w-100" id="resultAnalysis"
		tabindex="-1" role="dialog" aria-labelledby="myModalLabel20"
		aria-hidden="true">
		<div
			class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-full"
			role="document">
			<div class="modal-content">
				<div class="modal-header  bg-primary">
					<h4 class="modal-title" id="myModalLabel20">#{fbresource['Result_Analysis']}</h4>
					<button type="button" class="close" data-dismiss="modal"
						aria-label="Close">
						<i class="bx bx-x"></i>
					</button>
				</div>
				<div class="modal-body">
					<h:outputText
						rendered="#{RegistrationTableBean.resultAnalysis eq null}"
						value="#{fbresource['no_data']}" />
					<h:panelGroup
						rendered="#{RegistrationTableBean.resultAnalysis ne null}"
						id="resultAnalysisPanel">
						<center>
							<h:panelGrid columns="2">
								<o:chart
									rendered="#{RegistrationTableBean.resultAnalysis ne null}"
									style="marging-left:1000px;" height="300" width="500"
									model="#{RegistrationTableBean.resultAnalysis}" view="bar"
									titleText="#{fbresource['Status_of']} #{RegistrationTableBean.clickedRollNumber}">
									<o:barChartView colors="green,cyan,orange,red"
										labelsVisible="true" enable3D="true" shadowColor="green" />
								</o:chart>
								<o:chart
									rendered="#{RegistrationTableBean.resultPieAnalysis ne null}"
									style="marging-left:1000px;" height="300" width="500"
									model="#{RegistrationTableBean.resultPieAnalysis}" view="pie"
									titleText="#{fbresource['Status_of']} #{RegistrationTableBean.clickedRollNumber}">
									<o:pieChartView colors="cyan,orange,red,green"
										labelsVisible="true" tooltip="#{sector.key} - #{sector.value}" />
								</o:chart>
							</h:panelGrid>
						</center>
					</h:panelGroup>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-light-secondary"
						data-dismiss="modal">
						<i class="bx bx-x d-block d-sm-none"></i> <span
							class="d-none d-sm-block">#{fbresource['Close']}</span>
					</button>
				</div>
			</div>
		</div>
	</div>
	<!--Notice Message start -->
</h:form>
</html>
