<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="adminLayoutNew.xhtml">
	<ui:define name="content">
		<section id="card-actions">
			<!-- Info table about action starts -->
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">#{fbresource['referralList']}</h4>
							<a class="heading-elements-toggle"> <i
								class='bx bx-dots-vertical font-medium-3' /></a>
							<div class="heading-elements">
								<ul class="list-inline mb-0">
									<li><h:form>
											<h:panelGroup id="bookmarkButtonPanel">
												<o:commandLink id="bookmarkButton" execute="bookmarkButton"
													render="bookmarkButtonPanel bookmarkList errorPanel"
													actionListener="#{BookmarkBean.setBookmark}">
													<f:param name="bookmarkName" value="referralList" />
													
													<i title="#{fbresource['bookmarkToolTip']}"
														class="ficon bx #{BookmarkBean.getIcon('referralList')} warning" />
												</o:commandLink>
											</h:panelGroup>
										</h:form></li>
									<li><a data-action="collapse"> <i
											class="bx bx-chevron-down" /></a></li>
									<li><a data-action="expand"> <i
											class="bx bx-fullscreen" /></a></li>
									<li><a data-action="reload"> <i class="bx bx-revision" /></a></li>
									<li><a data-action="close"> <i class="bx bx-x" /></a></li>
								</ul>
							</div>
						</div>
						<div class="card-content collapse show">
							<div class="card-body">
								<div class="row">
									<div class="col-sm-12">
										<div class="table-responsive">
											<h:form id="feeForm"
												rendered="#{StudentRegistrationBean.referralFlag}">
												<table width="99%">
													<tr>
														<td>
															<table inlineStyle="color:green;" halign="left"
																cellSpacing="5">
																<tr>
																	<td><h:outputText
																			value="#{fbresource['referred']}" /></td>
																	<td><h:inputText
																			value="#{ReferralTableBean.referred}" id="referred"
																			columns="15" maximumLength="14">
																		</h:inputText></td>
																	<td><h:outputText
																			value="#{fbresource['referredBY']}" /></td>
																	<td><h:inputText
																			value="#{ReferralTableBean.referredBY}"
																			id="referredBY" columns="15" maximumLength="14">
																		</h:inputText></td>
																	<td><h:commandButton class="btn btn-primary glow"
																			value="#{fbresource['search']}"
																			title="#{fbresource['Click_here_to']} #{fbresource['Search_Record']}"
																			action="#{ReferralTableBean.searchRecord}" /></td>
																	<td><h:commandButton class="btn btn-primary glow"
																			value="#{fbresource['delete']}"
																			id="deleteButtonAction"
																			title="#{fbresource['Click_here_to']} #{fbresource['delete']}"
																			action="#{ReferralTableBean.deleteSeletedRecord}">
																			<o:confirmation id="buttonConfirmation"
																				message="#{fbresource['Are_you__sure_you_want_to_delete']}"
																				draggable="true" />
																		</h:commandButton></td>
																	<td><input type="button"
																		value="#{fbresource['Print']}"
																		class="btn btn-primary glow"
																		title="#{fbresource['Click_here_to']} #{fbresource['Print']}"
																		onClick="window.print()" /></td>
																	<td><h:commandButton
																			title="#{fbresource['Generate']} #{fbresource['Excel_report']}"
																			value="#{fbresource['Excel_report']}"
																			image="/images/excel_button.png"
																			style="height:40px;width:40px;" id="generateXls"
																			action="#{ReferralTableBean.generateXls}" /></td>
																	<td><h:commandButton
																			title="#{fbresource['Generate']} #{fbresource['PDF_report']}"
																			value="#{fbresource['PDF_report']}"
																			image="/images/pdf_button.png"
																			style="height:40px;width:40px;"
																			action="#{ReferralTableBean.generatePdfReport}" /></td>

																</tr>
																<tr>
																	<td><h:outputText value="#{fbresource.Date}" /></td>
																	<td><o:dateChooser pattern="dd/MM/yyyy" size="5"
																			buttonImageUrl="/images/calendar.gif"
																			immediate="true"
																			title="#{common['Please_enter_date_in_dd_mm_yyyy_format']}"
																			value="#{ReferralTableBean.date}" id="date">
																			<f:convertDateTime locale="in" pattern="dd/MM/yyyy" />
																		</o:dateChooser></td>
																	<td><h:outputText value="#{fbresource.to}" /></td>
																	<td><o:dateChooser pattern="dd/MM/yyyy"
																			buttonImageUrl="/images/calendar.gif"
																			immediate="true"
																			title="#{common['Please_enter_date_in_dd_mm_yyyy_format']}"
																			value="#{ReferralTableBean.toDate}" id="toDate">
																			<f:convertDateTime locale="in" pattern="dd/MM/yyyy" />
																		</o:dateChooser></td>
																</tr>
															</table>
														</td>
													</tr>
												</table>
												<h:panelGroup id="paginationTableContainner">
													<o:dataTable
														rendered="#{not empty ReferralTableBean.referralList}"
														id="feeListTable" var="referral"
														value="#{ReferralTableBean.referralList}"
														sortColumnId="rollnumber" sortAscending="true"
														sortableHeaderRolloverStyle="background: #d4d4d4"
														style="width: 100%; line-height: 17px;"
														styleClass="datatable"
														rolloverRowStyle="background: #f1f1f1;">
														<o:multipleRowSelection
															rowDatas="#{ReferralTableBean.selectedList}"
															style="background: #a4aec5; color: white;" />
														<o:columnReordering />
														<f:facet name="columnMenu">
															<o:columnMenu />
														</f:facet>
														<o:selectionColumn style="width: 6%;" sortable="true"
															header="#{fbresource['Selection']}">
															<f:facet name="header">
																<o:selectAllCheckbox />
															</f:facet>
														</o:selectionColumn>
														<o:column header="#{fbresource['referred']}"
															sortingExpression="#{referral.referred}"
															style="text-align: center;">
															<h:outputText value="#{referral.referred}" />
														</o:column>
														<o:column header="#{fbresource['referredBY']}"
															sortingExpression="#{referral.referredBY}"
															style="text-align: center;">
															<h:outputText value="#{referral.referredBY}" />
														</o:column>
														<o:column header="#{fbresource['Date']}"
															sortingExpression="#{referral.date}"
															style="text-align: center;">
															<h:outputText value="#{referral.date}">
																<f:convertDateTime pattern="dd/MM/yyyy" />
															</h:outputText>
														</o:column>
														<f:event listener="#{ReferralTableBean.inIt}"
															type="preRenderView" />
													</o:dataTable>
													<table align="right">
														<tr>
															<td><ui:include src="/xhtml/pagination.xhtml" /></td>
														</tr>
													</table>
												</h:panelGroup>
											</h:form>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</ui:define>
</ui:composition>
</html>
