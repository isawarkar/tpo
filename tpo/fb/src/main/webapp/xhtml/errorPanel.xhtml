<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<h:panelGroup id="errorPannel1">
	<f:verbatim
		rendered="#{UIBackingBean.successMessageBool || UIBackingBean.infoMessageBool || UIBackingBean.errorMessageBool}">
		<br />
	</f:verbatim>
	<h:outputText  title="#{fbresource['Success_Message']}"
		rendered="#{UIBackingBean.successMessageBool}"
		styleClass="successMessage" value="#{UIBackingBean.successMessage}" />
	<h:outputText  title="#{fbresource['Info_Message']}"
		rendered="#{UIBackingBean.infoMessageBool}" styleClass="infoMessage"
		value="#{UIBackingBean.infoMessage}" />
	<h:outputText  title="#{fbresource['Error_Message']}"
		rendered="#{UIBackingBean.errorMessageBool}" styleClass="errorMessage"
		value="#{UIBackingBean.errorMessage}" />
	<f:verbatim
		rendered="#{UIBackingBean.successMessageBool || UIBackingBean.infoMessageBool || UIBackingBean.errorMessageBool}">
		<br />
		<br />
	</f:verbatim>
</h:panelGroup>
</html>
