<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="/template/commonLayout.xhtml">
	<ui:define name="content">
		<h:form>
			<div id="Global_Container">
				<div class="Global_DividerTwo">
					<FIELDSET>
						<LEGEND>#{fbresource['Unsubscribe']}</LEGEND>
						<table width="960px">
							<tr>
								<td><INPUT type="hidden" name="emailId"
									value="#{param.email}" /> Are you sure to Unsubscribe ?</td>
							</tr>
						</table>
						<table>
							<tr>
								<td><o:commandButton
										action="#{CommonDBBean.unsubscribeFromNews}"
										value="#{fbresource['submit']}">
									</o:commandButton></td>
							</tr>
							<tr>
								<td><FONT size="2" color="red">
										#{fbresource['Please_try_again_by_clicking_on_link_that_was_sent_on_you_email']}
								</FONT></td>
							</tr>
						</table>
					</FIELDSET>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
</html>
