<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="/template/commonLayout.xhtml">
	<ui:define name="content">
		<h:form id="goupRequestForm">
			<INPUT type="hidden" name="collegeName"
				value="#{param.pnsgffmffbhvgkbf}" />
			<INPUT type="hidden" id="userName" name="userName" value="#{param.dfdnmfbnndfn}" />
			<INPUT type="hidden" name="action"
				value="#{param.fgfddgfdgdfgtdgbvcbdg}" />
			<INPUT type="hidden" name="id"
				value="#{param.dfgdgfdgfdgfdgdg}" />
			<h:commandButton id="submitButton" style="display:none;"
				action="#{CommonDBBean.collegeGroupRequest}"
				value="#{fbresource['submit']}">
			</h:commandButton>
		</h:form>
		<script>
		var un =document.getElementById('userName');
		if(un.value != ''){
			pleaseWaitLoading();
			document.getElementById('goupRequestForm:submitButton').click();
		}
		</script>
	</ui:define>
</ui:composition>
</html>
