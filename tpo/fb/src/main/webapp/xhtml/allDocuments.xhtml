<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="/template/commonLayoutWithOutFooter.xhtml">
	<ui:define name="content">
		<ui:include src="uploadDoc.xhtml" />
		<h:form id="contactAndAchivmentsForm">
			<div id="Global_Container">
				<ui:include src="webflow.xhtml" />
				<div class="Global_DividerTwo">
					<FIELDSET>
						<LEGEND>
							<h:outputText
								rendered="#{StudentRegistrationBean.currentMode eq 'Update'}"
								value="#{fbresource['Last_Updated_on']} #{StudentRegistrationBean.contactinfo.lastUpdated} #{fbresource['By']} #{StudentRegistrationBean.contactinfo.lastUpdatedBy}"></h:outputText>
						</LEGEND>
						<table style="margin-left: 20px;" cellSpacing="5">
							<tr>
								<td><h:outputText value="#{fbresource['Document_Name']}" /></td>
								<td><h:inputText value="#{AllDocumentsBean.documentName}"
										id="fileName" columns="15" maximumLength="12">
									</h:inputText></td>
								<td><h:commandButton value="#{fbresource['search']}"
										title="#{fbresource['Click_here_to']} #{fbresource['Search_Record']}"
										action="#{AllDocumentsBean.searchRecord}" /></td>
								<td><h:commandButton value="#{fbresource['delete']}"
										id="deleteButtonAction"
										title="#{fbresource['Click_here_to']} #{fbresource['delete']}"
										action="#{AllDocumentsBean.deleteSeletedRecord}">
										<o:confirmation id="buttonConfirmation"
											message="#{fbresource['Are_you__sure_you_want_to_delete']}"
											draggable="true" />
									</h:commandButton></td>
									<td><h:commandButton type="button"
										title="#{fbresource['Please_click_here_to_upload_document']}"
										rendered="#{StudentRegistrationBean.currentMode eq 'Update'}"
										onclick="openDocumnetPopUp();"
										value="#{fbresource['Upload_Document']}" /></td>
								<td><input type="button" value="#{fbresource['Print']}"
									title="#{fbresource['Click_here_to']} #{fbresource['Print']}"
									onClick="window.print()" /></td>
							</tr>
						</table>
						<h:panelGroup id="paginationTableContainner">
							<o:dataTable id="comapanyListTable" var="document"
								value="#{AllDocumentsBean.allDocumentList}"
								sortColumnId="fileName" sortAscending="true"
								sortableHeaderRolloverStyle="background: #d4d4d4"
								style="width: 1040px;margin-top: 10px; margin-left: 20px; line-height: 17px;"
								styleClass="datatable" rolloverRowStyle="background: #f1f1f1;">
								<o:multipleRowSelection
									rowDatas="#{AllDocumentsBean.selectedDocumentList}"
									style="background: #a4aec5; color: white;" />
								<o:columnReordering />
								<f:facet name="columnMenu">
									<o:columnMenu />
								</f:facet>
								<o:selectionColumn style="width: 6%;" sortable="true"
									header="#{fbresource['Selection']}">
									<f:facet name="header">
										<o:selectAllCheckbox />
									</f:facet>
								</o:selectionColumn>
								<o:column sortingExpression="#{document.isVerifiedWithOrgnal}"
									style="text-align: center;">
									<h:graphicImage url="/images/document.png"/>
								</o:column>
								<o:column header="#{fbresource['Document_Name']}"
									sortingExpression="#{document.documentID.documentName}"
									style="text-align: left;">
									<o:commandLink
											rendered="#{StudentRegistrationBean.currentMode eq 'Update'}"
											actionListener="#{DocumentUploadBean.setDocumentName}"
											onajaxend="openDocumentFullInformation();"
											render="documentFullInfo" style="font-size:20px;color:blue;">
											<f:param name="documentName" value="#{document.documentID.documentName}" />
											#{document.documentID.documentName}
										</o:commandLink>
								</o:column>
								<o:column header="#{fbresource['Verified']}"
									sortingExpression="#{document.isVerifiedWithOrgnal}"
									style="text-align: center;">
									<h:outputText
										rendered="#{document.isVerifiedWithOrgnal eq true}"
										value="#{fbresource['YES']}" />
									<h:outputText
										rendered="#{document.isVerifiedWithOrgnal eq false}"
										value="#{fbresource['NO']}" />
								</o:column>
								<o:column header="#{fbresource['date_of_verify']}"
									sortingExpression="#{document.verifiedDate}"
									style="text-align: center;">
									<h:outputText value="#{document.verifiedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy" />
									</h:outputText>
								</o:column>
								<o:column header="#{fbresource['date_of_uploading']}"
									sortingExpression="#{document.uploadedDate}"
									style="text-align: center;">
									<h:outputText value="#{document.uploadedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy" />
									</h:outputText>
								</o:column>
								<f:event listener="#{AllDocumentsBean.inIt}"
									type="preRenderView" />
							</o:dataTable>
							<table align="right" style="margin-right: 20px;">
								<tr>
									<td><ui:include src="/xhtml/pagination.xhtml" /></td>
								</tr>
							</table>
						</h:panelGroup>
					</FIELDSET>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
</html>
