<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="/template/commonLayout.xhtml">
	<ui:define name="content">
		<h:form id="resetUserPassword">
			<div id="Global_Container">
				<div class="Global_DividerTwo">
					<FIELDSET>
					<LEGEND>#{fbresource['Reset_User_Password']}</LEGEND>
					<table width="960px">
						<tr>
							<td colspan="2" valign="top"><label for="password">
									<p><h:outputText rendered="#{param.dfdnmfbnndfn ne null}" value="#{fbresource['User_Name']}"/></p>
							</label></td>
							<td>
							<INPUT type="hidden" name="oldpassword" value="#{param.pnsgffmffbhvgkbf}" />
							<INPUT type="hidden" name="rollnumber" value="#{param.dfdnmfbnndfn}" />
							#{param.dfdnmfbnndfn}
						</td>
						</tr>
						<tr>
							<td colspan="2" valign="top"><label for="password">
									<p>#{fbresource['New_Password']}</p>
							</label></td>
							<td>
							<h:panelGroup id="resetPassPanel"><h:inputSecret immediate="true"
									redisplay="true" maxlength="20"
									value="#{CommonDBBean.confirmPassword}"
									title="#{fbresource['Password_must_contains_one_lower_case_char']}"
									id="password" required="true"
									requiredMessage="Please enter new password.">
									<f:validator validatorId="PasswordValidator" />
									<f:ajax event="blur" render="resetPassPanel"/>
								</h:inputSecret> <input id="showPass" type="checkbox" onclick="showPassword('resetUserPassword','password');" title="#{fbresource['showPassword']}">#{fbresource['showPassword']}</input><o:floatingIconMessage style="border-color: red;"
									for="password" showDetail="true" showSummary="false" />
							</h:panelGroup></td>
						</tr>
						<tr>
							<td colspan="2" valign="top"><label for="confirmPassword">
									<p>#{fbresource['Confirm_Password']}</p>
							</label></td>
							<td><h:inputSecret immediate="true"
									redisplay="true" maxlength="20"
									title="#{fbresource['Password_must_contains_one_lower_case_char']}"
									id="confirmPassword" required="true"
									requiredMessage="Please enter Confirm password.">
									<f:validator validatorId="PasswordValidator" />
									<o:validateEqual for="password" />
								</h:inputSecret> <o:floatingIconMessage style="border-color: red;"
									for="confirmPassword" showDetail="true" showSummary="false" />
							</td>
						</tr>
					</table>
					<table>
						<tr>
							<td><o:commandButton style="margin-left: 200px;"
									action="#{CommonDBBean.resetUserPassword}"
									value="#{fbresource['submit']}">
									</o:commandButton>
									</td>
						</tr>
						<tr>
							<td>
							<FONT size="3" color="red">#{fbresource['Password_must_contains_one_lower_case_char']}
									</FONT>
									</td>
						</tr>
						<tr>
							<td>
							<FONT size="2" color="red">
							#{fbresource['Please_try_again_by_clicking_on_link_that_was_sent_on_you_email']}
									</FONT>
									</td>
						</tr>
					</table>
					</FIELDSET>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
</html>
