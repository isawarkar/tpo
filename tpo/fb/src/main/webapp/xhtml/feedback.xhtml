<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<head>
<!-- CSS Style -->
<link rel="stylesheet" type="text/css"
	href="/FB/feedback/stylesheet/bootstrap.min.css" />
<link rel="stylesheet" type="text/css"
	href="stylesheet/font-awesome.css" media="all" />
<link rel="stylesheet" type="text/css"
	href="/FB/feedback/stylesheet/revslider.css" />
<link rel="stylesheet" type="text/css"
	href="/FB/feedback/stylesheet/owl.carousel.css" />
<link rel="stylesheet" type="text/css"
	href="/FB/feedback/stylesheet/owl.theme.css" />
<link rel="stylesheet" type="text/css"
	href="/FB/feedback/stylesheet/jquery.bxslider.css" />
<link rel="stylesheet" type="text/css"
	href="/FB/feedback/stylesheet/jquery.mobile-menu.css" />
<link rel="stylesheet" type="text/css"
	href="/FB/feedback/stylesheet/style.css" media="all" />
<link rel="stylesheet" type="text/css"
	href="/FB/feedback/stylesheet/responsive.css" media="all" />
<link rel="stylesheet" type="text/css"
	href="/FB/feedback/stylesheet/daily.css" media="all" />


<link rel="stylesheet"
	href="http://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css" />
<link rel="stylesheet"
	href="http://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css" />
<link href="/FB/star/star-rating.css" media="all" rel="stylesheet"
	type="text/css" />
<script src="/FB/star/star-rating.js" type="text/javascript"></script>

<!-- JavaScript -->
<script type="text/javascript"
	src="/FB/feedback/js/bootstrap.min.js"></script>
<script type="text/javascript" src="/FB/feedback/js/revslider.js"></script>
<script type="text/javascript" src="/FB/feedback/js/common.js"></script>
<script type="text/javascript" src="/FB/feedback/js/countdown.js"></script>
<script type="text/javascript"
	src="/FB/feedback/js/jquery.bxslider.min.js"></script>
<script type="text/javascript"
	src="/FB/feedback/js/owl.carousel.min.js"></script>
<script type="text/javascript"
	src="/FB/feedback/js/jquery.mobile-menu.min.js"></script>
</head>
<!-- Logo Brand Block -->
<font size="5"><b>What our Customer Say's about Us.</b></font>
	
<div style="margin-top: 10px;"
	class="brand-logo wow bounceInUp animated">
	<div class="container">
		<div class="row">
			<div
				class="col-lg-6 col-md-6 col-sm-6 col-xs-12 testimonials-section">
				<div class="">
					<ul class="bxslider">
						<c:forEach items="#{CustomerReviewBean.reviewList}"
							var="customerReview">
							<li>
								<div class="avatar">
								<o:dynamicImage title="#{customerReview.userName}"
											data="#{CommonDBBean.getUserProfilePic(customerReview.userName)}" />
								</div>
								<div class="testimonials">
									<em>"</em> #{customerReview.comment}.<em>"</em>
								</div>
								<div class="clients_author">
									<span>#{customerReview.userName}</span>
								</div>
							</li>
						</c:forEach>
					</ul>
					<img height="150px;" width="300px;" src="star/star.gif" title="#{fbresource['Click_here_to_see_review_rating']}" style="cursor:hand;" onclick="window.open('/FB/xhtml/star.xhtml','_blank','width=500,height=100,toolbar=0,location=no,menubar=0')"/>
				</div>
			</div>
		</div>
	</div>
</div>
			
</html>
