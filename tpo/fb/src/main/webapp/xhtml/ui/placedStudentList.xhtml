<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="/templateNew/layoutWithOutFooter.xhtml">
	<ui:define name="content">
	<ui:include src="/xhtml/allPopUps.xhtml" />
		<h:form id="PlacedForm">
			<div class="account-form">
				<div class="account-form-inner">
					<TABLE style="width: 1100px; margin-left: 210px;">
						<tr>
							<td><h:outputText value="#{fbresource['Enrollment_No']}" /></td>
							<td><h:inputText size="10"
									title="#{fbresource['Please_type_some_char_It_is_a_like_search']}"
									value="#{PlacedStudentTableBean.rollNumber}" id="En_No" /></td>
							<td>#{fbresource['College_Name']}</td>
							<td><h:inputText
									title="#{fbresource['Please_type_some_char_It_is_a_like_search']}"
									value="#{PlacedStudentTableBean.collegeName}" id="collegeName" /></td>
							<td>#{fbresource['Company_Name']}</td>
							<td><h:inputText
									title="#{fbresource['Please_type_some_char_It_is_a_like_search']}"
									value="#{PlacedStudentTableBean.companyName}" id="companyName" /></td>
							<td><h:commandButton styleClass="btn btn-primary glow"
									title="#{fbresource['Click_here_to']} #{fbresource['Search_Record']}"
									action="#{PlacedStudentTableBean.searchRecord}"
									value="#{fbresource['search']}" /></td>
						</tr>
					</TABLE>
					<h:panelGroup id="paginationTableContainner">
						<o:dataTable
							rendered="#{not empty PlacedStudentTableBean.placedList}"
							id="placedStudentTable" var="placed"
							value="#{PlacedStudentTableBean.placedList}"
							sortColumnId="rollnumber" sortAscending="true"
							sortableHeaderRolloverStyle="background: #d4d4d4"
							style="width:1100px;margin-left: 210px;margin-top: 10px; line-height: 17px;"
							styleClass="datatable" rolloverRowStyle="background: #f1f1f1;">
							<o:columnReordering />
							<f:facet name="columnMenu">
								<o:columnMenu />
							</f:facet>
							<o:column header="#{fbresource['Photo']}"
								sortingExpression="#{placed.rollnumber}"
								style="width:50px; text-align: left;">
								<o:commandLink
									actionListener="#{PlacedStudentTableBean.setFileName}"
									onajaxend="document.getElementById('fullImageButton').click();"
									render="studentfullInfo" style="font-size:20px;color:blue;"
									id="studentRN">
									<f:param name="rollnumber" value="#{placed.rollnumber}" />
									<o:dynamicImage 
													data="#{CommonDBBean.getStudentProfilePic(placed.rollnumber)}"
													alt="#{fbresource['Click_here_to']} #{fbresource['see_full_image_of']} #{placed.rollnumber}"
													style="height: 50px; width: 70px" />
									
								</o:commandLink>
							</o:column>

							<o:column header="#{fbresource['Enrollment_No']}"
								sortingExpression="#{placed.rollnumber}"
								style="width: 100px; text-align: left;">
								<h:outputLabel value="#{placed.rollnumber}" />
							</o:column>

							<o:column header="#{fbresource['Full_Name']}"
								sortingExpression="#{placed.registration.firstName} #{placed.registration.lastName}"
								style="width: 100px; text-align: left;">
							#{placed.registration.firstName} #{placed.registration.lastName}
						</o:column>
							<o:column header="#{fbresource['Selected_IN']}"
								sortingExpression="#{placed.companyName}"
								style="width: 50px; text-align: left;color:blue;">
								<o:commandLink style="color:blue;" id="companyName"
									actionListener="#{CommonDBBean.setCompany}"
									onajaxend="document.getElementById('companyButton').click();"
									render="companyInfo" value="#{fbresource['Click_here']}"
									title="#{fbresource['Click_here_to_see_the_Company_Details']}">
									<f:param value="#{placed.companyName}" />
									#{fbresource['Click_here']}
								</o:commandLink>

							</o:column>
							<o:column header="#{fbresource['Course']}"
								sortingExpression="#{placed.course}"
								style="width: 100px; text-align: left;">
							#{placed.course}
						</o:column>
							<o:column header="#{fbresource['Branch']}"
								sortingExpression="#{placed.branch}"
								style="width: 100px; text-align: left;">
							#{placed.branch}
						</o:column>
							<o:column header="#{fbresource['Semester']}"
								sortingExpression="#{placed.semester}"
								style="width: 50px; text-align: left;">
							#{placed.semester}
						</o:column>
							<o:column header="#{fbresource['Year_of_Passing']}"
								sortingExpression="#{placed.yearOfPassing}"
								style="width: 50px; text-align: left;">
							#{placed.yearOfPassing}
						</o:column>
							<o:column header="#{fbresource['College_Name']}"
								sortingExpression="#{placed.registration.collegeName}"
								style="width: 60px; text-align: left;color:blue;">
								<o:commandLink style="color:blue;" id="collegeNameValue"
									value="#{placed.registration.collegeName}"
									title="#{fbresource['Click_here_to_see_the_College_Details']}"
									actionListener="#{PlacedStudentTableBean.setCollege}"
									onajaxend="document.getElementById('collegeButton').click();"
									render="collegeInfo">
								</o:commandLink>
							</o:column>
							<f:event listener="#{PlacedStudentTableBean.inIt}"
								type="preRenderView"></f:event>
						</o:dataTable>
						<table align="right" style="margin-right: 20px;">
							<tr>
								<td><ui:include src="/xhtml/pagination.xhtml" /></td>
							</tr>
						</table>
					</h:panelGroup>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
</html>
