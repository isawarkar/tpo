<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<ui:composition template="/templateNew/layoutWithOutFooter.xhtml">
	<ui:define name="content">
		<ui:include src="/xhtml/allPopUps.xhtml" />
		<h:form id="resetStudentPassword">
			<div class="content-block">
				<FIELDSET>
					<LEGEND style="margin-left: 130px;">#{fbresource['Reset_User_Password']}</LEGEND>
					<table width="960px" style="margin-left: 130px;">
						<tr>
							<td colspan="2" valign="top"><label for="password">
									<p>
										<h:outputText rendered="#{param.dfdnmfbnndfn ne null}"
											value="#{fbresource['Enrollment_No']}" />
									</p>
							</label></td>
							<td><INPUT type="hidden" name="oldpassword"
								value="#{param.pnsgffmffbhvgkbf}" /> <INPUT type="hidden"
								name="rollnumber" value="#{param.dfdnmfbnndfn}" />
								#{param.dfdnmfbnndfn}</td>
						</tr>
						<tr>
							<td colspan="2" valign="top"><label for="password">
									<p>#{fbresource['New_Password']}</p>
							</label></td>
							<td><h:panelGroup id="resetPassPanel">
									<h:inputSecret immediate="true" redisplay="true" maxlength="20"
										value="#{CommonDBBean.confirmPassword}"
										title="#{fbresource['Password_must_contains_one_lower_case_char']}"
										id="NewPassword" required="true"
										requiredMessage="Please enter new password.">
										<f:validator validatorId="PasswordValidator" />
										<f:ajax event="blur" render="resetPassPanel" />
									</h:inputSecret>
									<input id="showPass" type="checkbox"
										onclick="showPassword('resetStudentPassword','NewPassword');"
										title="#{fbresource['showPassword']}">#{fbresource['showPassword']}</input>
									<o:floatingIconMessage style="border-color: red;"
										for="NewPassword" showDetail="true" showSummary="false" />
								</h:panelGroup></td>
						</tr>
						<tr>
							<td colspan="2" valign="top"><label for="confirmPassword">
									<p>#{fbresource['Confirm_Password']}</p>
							</label></td>
							<td><h:inputSecret immediate="true" redisplay="true"
									maxlength="20"
									title="#{fbresource['Password_must_contains_one_lower_case_char']}"
									id="ConfirmPassword" required="true"
									requiredMessage="Please enter Confirm password.">
									<f:validator validatorId="PasswordValidator" />
									<o:validateEqual for="NewPassword" />
								</h:inputSecret> <o:floatingIconMessage style="border-color: red;"
									for="ConfirmPassword" showDetail="true" showSummary="false" />
							</td>
						</tr>
					</table>
					<table style="margin-left: 130px;">
						<tr>
							<td><o:commandButton style="margin-left: 200px;" styleClass="btn btn-primary glow" action="#{CommonDBBean.resetPassword}"
									value="#{fbresource['submit']}">
								</o:commandButton></td>
						</tr>
						<tr>
							<td><FONT size="3" color="red">#{fbresource['Password_must_contains_one_lower_case_char']}
							</FONT></td>
						</tr>
						<tr>
							<td><FONT size="2" color="red">
									#{fbresource['Please_try_again_by_clicking_on_link_that_was_sent_on_you_email']}
							</FONT></td>
						</tr>
					</table>
				</FIELDSET>
				<br/><br/><br/><br/><br/><br/><br/><br/><br/>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
</html>
