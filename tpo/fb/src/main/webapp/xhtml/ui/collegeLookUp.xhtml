<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:o="http://openfaces.org/">
<h:form id="collegeLookUpForm">
	<script>
		function checkCollegeCOdeSelected() {
			var selectedVar = $("input[name='collegeCodeRadio']:checked");
			var seletedValue = selectedVar.val();
			if (typeof (seletedValue) != "undefined") {
				var element = findElement('collegeCodeLookUpValue');
				document.getElementById(element).value = seletedValue;
				document.getElementById('closeMe').click();
			} else {
				alert('Please select collge code.');
			}
		}
	</script>
	 <button style="display:none" id="collegeCodeButton"  type="button"  data-toggle="modal" data-target="#collegeCode"/>
	<div class="modal fade text-left" id="collegeCode" tabindex="-1" style="margin-top: 90px;"
		role="dialog" aria-labelledby="myModalLabel160" aria-hidden="true">
		<div
			class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl"
			role="document">
			<div class="modal-content">
				<div class="modal-header bg-primary">
					<h5 class="modal-title white" id="myModalLabel160">#{fbresource['College_List']}</h5>
					<button type="button" class="close" data-dismiss="modal"
						aria-label="Close">
						<i class="bx bx-x"></i>
					</button>
				</div>
				<div class="modal-body">
					<ui:include src="/xhtml/errorPanel.xhtml" />
					<table halign="left">
						<tr>
							<td>#{fbresource['College_Code']}</td>
							<td><h:inputText value="#{CollegeLookUpBean.collegeCode}"
									id="collegeCode">
								</h:inputText></td>
							<td>#{fbresource['College_Name']}</td>
							<td><h:inputText value="#{CollegeLookUpBean.collegeName}"
									id="collegeName">
								</h:inputText></td>
						</tr><tr>
							<td>#{fbresource['City_Place']}</td>
							<td><h:inputText value="#{CollegeLookUpBean.city}" id="city">
								</h:inputText></td>
							<td>#{fbresource['Address']}</td>
							<td><h:inputText value="#{CollegeLookUpBean.address}"
									id="address">
								</h:inputText></td>
							<td><o:commandButton value="#{fbresource['search']}"
									title="#{fbresource['Click_here_to']} #{fbresource['Search_Record']}"
									render="collegeLookUPPanel"
									execute="collegeCode collegeName city address"
									action="#{CollegeLookUpBean.searchRecord}" /></td>
						</tr>
					</table>
					<h:panelGroup id="collegeLookUPPanel">
						<h:panelGroup id="paginationTableContainner">
							<o:dataTable id="collegeLookUPTable" var="college"
								value="#{CollegeLookUpBean.collegeList}" sortColumnId="title"
								sortAscending="true"
								sortableHeaderRolloverStyle="background: #d4d4d4"
								style="width: 100%;line-height: 17px;" styleClass="datatable"
								rolloverRowStyle="background: #f1f1f1;">
								<o:singleRowSelection style="background: #a4aec5; color: white" />
								<o:columnReordering />
								<f:facet name="columnMenu">
									<o:columnMenu />
								</f:facet>
								<o:column id="select" header="#{fbresource['Select']}"
									style="text-align: center;">
									<input type="radio" value="#{college.collegeName}"
										name="collegeCodeRadio"></input>
								</o:column>

								<o:column id="collegeCode"
									header="#{fbresource['College_Code']}"
									sortingExpression="#{college.collegeName}"
									style="text-align: center;">
									<h:outputText value="#{college.collegeName}" />
								</o:column>
								<o:column header="#{fbresource['College_Name']}"
									sortingExpression="#{college.collegeFullName}"
									style="text-align: center;">
									<h:outputText value="#{college.collegeFullName}" />
								</o:column>
								<o:column header="#{fbresource['City_Place']}"
									sortingExpression="#{college.place}"
									style="text-align: center;">
									<h:outputText value="#{college.place}" />
								</o:column>
								<o:column header="#{fbresource['Address']}"
									sortingExpression="#{college.address}"
									style="text-align: center;">
									<h:outputText escape="false" value="#{college.address}" />
								</o:column>
								<o:column style="text-align: center;">
									<h:commandButton type="button" value="#{fbresource['Select']}"
										title="Select College Code"
										onclick="checkCollegeCOdeSelected();" />
								</o:column>
								<f:event listener="#{CollegeLookUpBean.inIt}"
									type="preRenderView" />
							</o:dataTable>
							<table align="right" style="margin-right: 20px;">
								<tr>
									<td><ui:include src="/xhtml/pagination.xhtml" /></td>
								</tr>
							</table>
						
						</h:panelGroup>
					</h:panelGroup>
					<font color="red" size="4">#{fbresource['college_Note']}</font>
				</div>
				<div class="modal-footer">
					<button id="closeMe" type="button" class="btn btn-light-secondary"
						data-dismiss="modal">
						<i class="bx bx-x d-block d-sm-none"></i> <span
							class="d-none d-sm-block">Close</span>
					</button>
				</div>
			</div>
		</div>
	</div>
</h:form>
</html>
