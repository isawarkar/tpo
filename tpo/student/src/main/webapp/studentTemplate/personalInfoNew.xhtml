												#{fbresource['Gender']}

										<td><h:outputText

											<td><label for="diplomaYearOfPassing">
													#{fbresource['Diploma_Year_Of_Passing']}

											<td><h:outputText

										<td><label for="dob">

													<o:column>

										</tr>

													<o:column>

											<td><label for="graduationUniversity">

											<td><o:dropDownField maxlength="100"

											<td><o:dropDownField id="pgYearOfPassing" maxlength="4"

												</o:dropDownField> <o:floatingIconMessage style="border-color: red;"
													for="pgYearOfPassing" showDetail="true" showSummary="false" /></td>

													<o:column>

											<td><label for="specialization">

											<td><o:dropDownField id="specialization"
													immediate="true" style="width: 200px;"
													listItemStyle="white-space: nowrap;" maxlength="50"
													suggestionMode="stringStart" var="specialization"
													value="#{StudentRegistrationBean.personalinfo.specialization}"
													suggestionMinChars="1">
													<o:dropDownItems value="#{CommonDBBean.getCommonData('specialization')}" />
													<o:column>
														<h:outputText value="#{specialization}"
															styleClass="dropDownValuesClass" />
													</o:column>
												</o:dropDownField> <o:floatingIconMessage style="border-color: red;"
													for="specialization" showDetail="true" showSummary="false" /></td>
