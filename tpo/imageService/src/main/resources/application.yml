spring:
  application:
    name: imageservice
  profiles:
    #active: "prod"
    active: "dev"
  main:
   allow-bean-definition-overriding: true

management:
  security:
    enabled: false

logging:
  level:
   root: INFO

---

spring:
  profiles: dev
server:
  address: localhost
  port: 8080
eureka:
  client:
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    statusPageUrl: http://${eureka.hostname}/imageservice/actuator/health
    healthCheckUrl: http://${eureka.hostname}/imageservice/actuator/health
    homePageUrl: http://${eureka.hostname}/imageservice/
    ip-address: ${server.address}:${server.port}
    nonSecurePortEnabled: true
    preferIpAddress: true

---

spring:
  profiles: prod
server:
   address: imageserver.fresherbuddy.in
   port: 8080
eureka:
  client:
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: http://52.66.38.48:8761/eureka
  instance:
    statusPageUrl: http://${eureka.hostname}/imageservice/actuator/health
    healthCheckUrl: http://${eureka.hostname}/imageservice/actuator/health
    homePageUrl: http://${eureka.hostname}/imageservice/
    ip-address: ${server.address}:${server.port}
    nonSecurePortEnabled: true
    preferIpAddress: true
  

